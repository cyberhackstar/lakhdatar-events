spring:
  mail:
    # Empty host = no mail sender bean = email features stay off (ticket page + /recover still work).
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  application:
    name: lakhdatar-events-backend
    version: ${APP_VERSION:2.0.14}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lakhdatar}
    username: ${DB_USERNAME:lakhdatar}
    password: ${DB_PASSWORD:change-me}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:2000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: ${CLOUDINARY_MAX_BYTES:5242880}
      max-request-size: ${CLOUDINARY_MAX_REQUEST_BYTES:7340032}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful
  tomcat:
    # Keep connection capacity high while protecting the JVM with a bounded request-thread pool.
    # Public read bursts should be absorbed by NGINX/Cloudflare; dynamic/payment paths remain bounded.
    threads:
      max: ${SERVER_TOMCAT_MAX_THREADS:200}
      min-spare: ${SERVER_TOMCAT_MIN_SPARE_THREADS:20}
    max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS:10000}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:1000}
    connection-timeout: ${SERVER_TOMCAT_CONNECTION_TIMEOUT:5s}
    keep-alive-timeout: ${SERVER_TOMCAT_KEEP_ALIVE_TIMEOUT:30s}
    max-keep-alive-requests: ${SERVER_TOMCAT_MAX_KEEP_ALIVE_REQUESTS:100}
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/css,application/javascript,text/javascript,image/svg+xml
    min-response-size: 1024

management:
  opentelemetry:
    enabled: ${OTEL_SDK_ENABLED:false}
    resource-attributes:
      deployment.environment: ${APP_ENV:production}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://tempo:4318/v1/traces}
  tracing:
    export:
      enabled: ${TRACING_EXPORT_ENABLED:true}
      otlp:
        enabled: ${TRACING_OTLP_ENABLED:true}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  health:
    mail:
      # An unreachable SMTP server must never take the API out of the load balancer.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
  # Prometheus scrapes /actuator/prometheus. Disable Micrometer's separate OTLP push exporter
  # by default so an absent localhost:4318 collector cannot create recurring connection errors or waste threads.
  otlp:
    metrics:
      export:
        enabled: ${OTEL_METRICS_EXPORT_ENABLED:false}
        step: ${OTEL_METRICS_EXPORT_STEP:60s}
  metrics:
    tags:
      application: ${spring.application.name}
      version: ${spring.application.version}
      instance: ${HOSTNAME:unknown}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,1s,3s

app:
  observability:
    logs:
      enabled: ${OPS_LOGS_ENABLED:true}
    loki-url: ${LOKI_URL:http://loki:3100}
    log-query-timeout-ms: ${LOKI_QUERY_TIMEOUT_MS:4000}
  monitoring:
    business-refresh-ms: ${BUSINESS_METRICS_REFRESH_MS:30000}
  worker:
    enabled: ${WORKER_ENABLED:true}
  webhook:
    max-attempts: ${WEBHOOK_MAX_ATTEMPTS:12}
    retry-base-delay: ${WEBHOOK_RETRY_BASE_DELAY:2s}
    retry-max-delay: ${WEBHOOK_RETRY_MAX_DELAY:15m}
    recovery-sweep: ${WEBHOOK_RECOVERY_SWEEP:15000}
    retention-days: ${WEBHOOK_RETENTION_DAYS:365}
    retention-batch-size: ${WEBHOOK_RETENTION_BATCH_SIZE:500}
    retention-sweep: ${WEBHOOK_RETENTION_SWEEP:21600000}
  mail:
    # Ticket emails and team invites are enabled only when MAIL_HOST and MAIL_FROM are both set.
    from: ${MAIL_FROM:}
  mail-delivery-sweep: ${MAIL_DELIVERY_SWEEP:30000}
  mail-delivery-cleanup-sweep: ${MAIL_DELIVERY_CLEANUP_SWEEP:21600000}
  mail-delivery-repair-sweep: ${MAIL_DELIVERY_REPAIR_SWEEP:30000}
  jwt:
    secret: ${JWT_SECRET:replace-with-a-long-random-secret-at-least-32-bytes}
    access-token: ${JWT_ACCESS_TOKEN:15m}
    refresh-token: ${JWT_REFRESH_TOKEN:14d}
  security:
    ticket-view-secret: ${TICKET_VIEW_SECRET:replace-with-a-long-random-secret-at-least-32-bytes}
    ticket-view-previous-secret: ${TICKET_VIEW_SECRET_PREVIOUS:}
    refresh-cookie-secure: ${AUTH_COOKIE_SECURE:false}
    ticket-view-ttl: ${TICKET_VIEW_TTL:24h}
  qr:
    signing-secret: ${QR_SIGNING_SECRET:replace-with-a-long-random-secret-at-least-32-bytes}
    previous-signing-secret: ${QR_SIGNING_SECRET_PREVIOUS:}
    image-size: ${QR_IMAGE_SIZE:512}
  reservation:
    hold: ${RESERVATION_HOLD:12m}
    sweep: ${RESERVATION_SWEEP:30s}
  refund:
    recovery-sweep: ${REFUND_RECOVERY_SWEEP:30s}
    cancellation-sweep: ${REFUND_CANCELLATION_SWEEP:30s}
    max-attempts: ${REFUND_MAX_ATTEMPTS:8}
    retry-base-delay: ${REFUND_RETRY_BASE_DELAY:30s}
    retry-max-delay: ${REFUND_RETRY_MAX_DELAY:6h}
    processing-timeout: ${REFUND_PROCESSING_TIMEOUT:24h}
  razorpay:
    base-url: ${RAZORPAY_BASE_URL:https://api.razorpay.com/v1}
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    reconciliation-age-ms: ${PAYMENT_RECONCILIATION_AGE_MS:120000}
    reconciliation-sweep-ms: ${PAYMENT_RECONCILIATION_SWEEP:30000}
    order-recovery-sweep: ${PAYMENT_ORDER_RECOVERY_SWEEP:30000}
    http-connect-timeout-ms: ${RAZORPAY_CONNECT_TIMEOUT_MS:3000}
    http-read-timeout-ms: ${RAZORPAY_READ_TIMEOUT_MS:8000}
  cashfree:
    base-url: ${CASHFREE_BASE_URL:https://api.cashfree.com/pg}
    app-id: ${CASHFREE_APP_ID:}
    secret-key: ${CASHFREE_SECRET_KEY:}
    api-version: ${CASHFREE_API_VERSION:2025-01-01}
    reconciliation-age-ms: ${CASHFREE_RECONCILIATION_AGE_MS:120000}
    reconciliation-sweep-ms: ${CASHFREE_RECONCILIATION_SWEEP:30000}
    http-connect-timeout-ms: ${CASHFREE_CONNECT_TIMEOUT_MS:3000}
    http-read-timeout-ms: ${CASHFREE_READ_TIMEOUT_MS:8000}
    webhook-tolerance-ms: ${CASHFREE_WEBHOOK_TOLERANCE_MS:300000}
  payment:
    reconciliation-age-ms: ${PAYMENT_RECONCILIATION_AGE_MS:120000}
    reconciliation-sweep-ms: ${PAYMENT_RECONCILIATION_SWEEP:30000}
  initial-admin:
    enabled: ${INITIAL_ADMIN_SETUP_ENABLED:false}
    setup-token: ${INITIAL_ADMIN_SETUP_TOKEN:}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    folder: ${CLOUDINARY_FOLDER:neelastack-events}
    max-bytes: ${CLOUDINARY_MAX_BYTES:5242880}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  rate-limit:
    login-per-window: ${LOGIN_RATE_LIMIT_PER_WINDOW:10}
    public-checkout-per-window: ${CHECKOUT_RATE_LIMIT_PER_WINDOW:20}
    scan-per-minute: ${CHECKIN_RATE_LIMIT_PER_MINUTE:240}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
    fail-closed-on-redis-error: ${RATE_LIMIT_FAIL_CLOSED:true}
  checkout:
    max-tickets-per-order: ${MAX_TICKETS_PER_ORDER:20}
    session-ttl: ${CHECKOUT_SESSION_TTL:20m}
  checkin:
    early-window: ${CHECKIN_EARLY_WINDOW:30m}
  branding:
    neelastack-name: ${NEELASTACK_NAME:Neelastack}
    neelastack-public-url: ${NEELASTACK_PUBLIC_URL:https://neelastack.com}
    # Platform mark bundled with the frontend (frontend/src/assets/neelastack-logo.png). Intentionally not configurable by env.
    neelastack-logo-url: /assets/neelastack-logo.png
    # Organizers have no built-in logo: name and logo are entered (Cloudinary upload) when the organizer is created.
    default-organizer-logo-url: ""
    promo-enabled: ${NEELASTACK_PROMO_ENABLED:true}
    promo-title: ${NEELASTACK_PROMO_TITLE:Powered by Neelastack}
    promo-description: ${NEELASTACK_PROMO_DESCRIPTION:Build modern digital experiences for your business.}
    promo-cta: ${NEELASTACK_PROMO_CTA:Explore Neelastack}
  auth:
    cleanup-sweep: ${REFRESH_TOKEN_CLEANUP_SWEEP:3600000}
    password-reset-cleanup-sweep: ${PASSWORD_RESET_CLEANUP_SWEEP:21600000}
    mfa-cleanup-sweep: ${MFA_CLEANUP_SWEEP:21600000}
  mfa:
    required-for-privileged: ${MFA_REQUIRED_FOR_PRIVILEGED:false}
    encryption-key: ${MFA_ENCRYPTION_KEY:}
    issuer: ${MFA_ISSUER:Neelastack Events}
  # Canonical public origin used for sitemap/robots. Never derived from request headers.
  public-base-url: ${PUBLIC_BASE_URL:https://events.neelastack.com}
  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:false}
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    admin-name: ${BOOTSTRAP_ADMIN_NAME:Platform Administrator}
    organizer-name: ${BOOTSTRAP_ORGANIZER_NAME:Lakhdatar Events}
    organizer-slug: ${BOOTSTRAP_ORGANIZER_SLUG:lakhdatar-events}
    event-slug: ${BOOTSTRAP_EVENT_SLUG:dandiya-night-2026}
  support:
    email: ${SUPPORT_EMAIL:support@example.com}
    phone: ${SUPPORT_PHONE:+91 00000 00000}

logging:
  structured:
    format:
      console: ${LOG_STRUCTURED_FORMAT:ecs}
    ecs:
      service:
        name: ${spring.application.name}
        version: ${spring.application.version}
        environment: ${APP_ENV:production}
  pattern:
    level: "%5p [%X{correlationId:-}] [ip=%X{clientIp:-}]"
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.neelastack.lakhdatar: ${LOG_LEVEL_APP:INFO}
    com.neelastack.lakhdatar.service: ${LOG_LEVEL_SERVICE:INFO}
