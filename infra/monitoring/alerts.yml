# Prometheus rule examples. Integrate into the platform's existing Prometheus stack.
groups:
  - name: lakhdatar-events
    rules:
      - alert: LakhdatarBackendDown
        expr: up{job=~"lakhdatar-backend.*"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: Lakhdatar backend target is down
      - alert: LakhdatarHigh5xxRate
        expr: sum(rate(http_server_requests_seconds_count{application="lakhdatar-events-backend",status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{application="lakhdatar-events-backend"}[5m])), 1) > 0.02
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: Lakhdatar backend 5xx rate exceeds 2%
      - alert: LakhdatarHighLatency
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{application="lakhdatar-events-backend"}[5m])) by (le)) > 1
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: Lakhdatar backend p95 latency exceeds 1 second
      - alert: LakhdatarDatabasePoolExhaustion
        expr: hikaricp_connections_pending{application="lakhdatar-events-backend"} > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Requests are waiting for database connections
