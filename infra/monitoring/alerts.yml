groups:
  - name: lakhdatar-critical
    rules:
      - alert: LakhdatarBackendDown
        expr: up{job="lakhdatar-backend"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: Lakhdatar backend is down
      - alert: LakhdatarHigh5xx
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])),1) > 0.05
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: Backend 5xx rate is above 5%
      - alert: LakhdatarDatabasePoolSaturation
        expr: hikaricp_connections_pending > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Database connection pool has pending waiters
