groups:
  - name: neelastack-events
    rules:
      - alert: BackendDown
        expr: up{job="lakhdatar-backend"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Event platform backend is down"}
      - alert: High5xxRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count[5m])) > 0.02
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "More than 2% of requests are failing with 5xx"}
      - alert: EventListingSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{uri=~"/api/v1/public/events.*"}[5m]))) > 0.8
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "p95 event listing/detail latency above 800ms"}
      - alert: CheckoutSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{uri=~"/api/v1/public/checkout.*"}[5m]))) > 2
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "p95 checkout latency above 2s"}
      - alert: CheckoutFailures
        expr: sum(rate(http_server_requests_seconds_count{uri=~"/api/v1/public/checkout.*",status=~"5.."}[10m])) > 0.05
        for: 10m
        labels: {severity: critical}
        annotations: {summary: "Checkout is returning server errors"}
      - alert: WebhookFailures
        expr: sum(rate(http_server_requests_seconds_count{uri=~"/api/v1/webhooks.*",status=~"5.."}[10m])) > 0
        for: 10m
        labels: {severity: critical}
        annotations: {summary: "Payment webhooks are failing; payments may be unconfirmed"}
      - alert: CheckinFailures
        expr: sum(rate(http_server_requests_seconds_count{uri=~"/api/v1/checkin.*",status=~"5.."}[5m])) > 0
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "Gate check-in is returning server errors"}
      - alert: JvmHeapHigh
        expr: sum(jvm_memory_used_bytes{area="heap"}) / sum(jvm_memory_max_bytes{area="heap"}) > 0.9
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "JVM heap above 90%"}
      - alert: DatabasePoolExhausted
        expr: hikaricp_connections_pending > 0
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Requests are waiting for a database connection"}
