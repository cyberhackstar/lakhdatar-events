# Enterprise observability stack. Metrics/logs/traces stay on the private application network.
# Grafana is exposed only on the VM loopback interface for SSH-tunnel/VPN access. Exporters remain private.
name: lakhdatar-observability

services:
  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --storage.tsdb.wal-compression
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./recording-rules.yml:/etc/prometheus/recording-rules.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks: [lakhdatar_net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10

  alertmanager:
    image: prom/alertmanager:v0.34.1
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks: [lakhdatar_net]

  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: "false"
      GF_SECURITY_COOKIE_SAMESITE: "strict"
      GF_SERVER_ENABLE_GZIP: "true"
      GF_LOG_MODE: "console"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3100}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [lakhdatar_net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks: [lakhdatar_net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 10

  tempo:
    image: grafana/tempo:3.1.0
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    networks: [lakhdatar_net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3200/ready"]
      interval: 15s
      timeout: 5s
      retries: 10

  alloy:
    image: grafana/alloy:v1.20.1
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    volumes:
      - ./alloy.config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [lakhdatar_net]
    depends_on:
      loki: {condition: service_healthy}

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)(/|$)
    volumes:
      - /:/host:ro,rslave
    networks: [lakhdatar_net]

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    restart: unless-stopped
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --disable_metrics=accelerator,hugetlb,referenced_memory,resctrl,tcp,udp,percpu
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks: [lakhdatar_net]

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      DATA_SOURCE_URI: "postgres:5432/lakhdatar?sslmode=disable"
      DATA_SOURCE_USER: ${PG_EXPORTER_USER:?PG_EXPORTER_USER is required}
      DATA_SOURCE_PASS: ${PG_EXPORTER_PASSWORD:?PG_EXPORTER_PASSWORD is required}
      PG_EXPORTER_DISABLE_SETTINGS_METRICS: "true"
    networks: [lakhdatar_net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9187/metrics"]
      interval: 20s
      timeout: 5s
      retries: 10

  redis-exporter:
    image: oliver006/redis_exporter:v1.88.0
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_USER: ${REDIS_USER:-default}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    networks: [lakhdatar_net]

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.1
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    command: ["--nginx.scrape-uri=http://edge:8080/stub_status"]
    networks: [lakhdatar_net]

  blackbox-exporter:
    image: quay.io/prometheus/blackbox-exporter:v0.28.0
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks: [lakhdatar_net]

networks:
  lakhdatar_net:
    external: true
    name: lakhdatar_net

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  loki_data:
  tempo_data:
