# The console receiver intentionally has no outbound sink by default. This prevents a clone/deploy
# from accidentally emailing or paging a personal address. Configure email/Slack/webhook routing
# in this file before production incident paging is enabled.
global:
  resolve_timeout: 5m

route:
  receiver: ops-console
  group_by: [alertname, service, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: ops-console
