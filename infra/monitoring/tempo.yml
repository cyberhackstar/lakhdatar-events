auth_enabled: false

server:
  http_listen_port: 3200
  grpc_listen_port: 9096

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

compactor:
  compaction:
    block_retention: 7d

metrics_generator:
  storage:
    path: /var/tempo/generator-wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
  processor:
    - service-graphs
    - span-metrics
  registry:
    external_labels:
      source: tempo
      cluster: lakhdatar-events

overrides:
  defaults:
    metrics_generator:
      processors:
        - service-graphs
        - span-metrics
