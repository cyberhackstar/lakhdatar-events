# Fixed project name so this stack can never collide with other Compose projects on the same VM
# (the default name would be derived from the "infra" directory).
name: lakhdatar-events

services:
  postgres:
    image: postgres:16-alpine
    container_name: lakhdatar-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: "2.0"
    environment:
      POSTGRES_DB: lakhdatar
      POSTGRES_USER: lakhdatar
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - lakhdatar_pg_data:/var/lib/postgresql/data
    networks: [lakhdatar_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakhdatar -d lakhdatar"]
      interval: 10s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    container_name: lakhdatar-redis
    restart: unless-stopped

    # Redis 7 Alpine creates the redis account as UID 999 / GID 1000.
    # Start directly as that account so the image entrypoint does not need a
    # root -> redis setpriv transition while cap_drop/no-new-privileges are active.
    user: "999:1000"

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 256
    mem_limit: 1536m
    cpus: "1.5"

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

    # The password is read from the container environment ($$ is Compose's escape for a literal $),
    # so it never appears in the Compose-rendered command line, `docker inspect`, or the process list.
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --maxmemory 1024mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"

    volumes:
      - lakhdatar_redis_data:/data

    networks:
      - lakhdatar_net

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG'
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
  backend:
    image: ${IMAGE_NAMESPACE}/lakhdatar-backend:${IMAGE_TAG}
    container_name: lakhdatar-backend
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 1g
    cpus: "2.0"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    environment:
      APP_ENV: production
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-lakhdatar-events-backend}
      DEFAULT_PAYMENT_PROVIDER: ${DEFAULT_PAYMENT_PROVIDER:-CASHFREE}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.version=2.0.2,deployment.environment=production}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://tempo:4318/v1/traces}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.10}
      OTEL_SDK_ENABLED: ${OTEL_SDK_ENABLED:-true}
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/lakhdatar}
      DB_USERNAME: ${DB_USERNAME:-lakhdatar}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_SSL: ${REDIS_SSL:-false}
      JWT_ACCESS_TOKEN: ${JWT_ACCESS_TOKEN:-15m}
      JWT_REFRESH_TOKEN: ${JWT_REFRESH_TOKEN:-14d}
      TICKET_VIEW_TTL: ${TICKET_VIEW_TTL:-24h}
      CHECKIN_EARLY_WINDOW: ${CHECKIN_EARLY_WINDOW:-30m}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      REFRESH_TOKEN_CLEANUP_SWEEP: ${REFRESH_TOKEN_CLEANUP_SWEEP:-3600000}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DB_POOL_MIN: ${DB_POOL_MIN:-5}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-5000}
      DB_VALIDATION_TIMEOUT_MS: ${DB_VALIDATION_TIMEOUT_MS:-2000}
      DB_MAX_LIFETIME_MS: ${DB_MAX_LIFETIME_MS:-1800000}
      RESERVATION_HOLD: ${RESERVATION_HOLD:-12m}
      RESERVATION_SWEEP: ${RESERVATION_SWEEP:-30s}
      PAYMENT_ORDER_RECOVERY_SWEEP: ${PAYMENT_ORDER_RECOVERY_SWEEP:-30000}
      REFUND_RECOVERY_SWEEP: ${REFUND_RECOVERY_SWEEP:-30000}
      QR_IMAGE_SIZE: ${QR_IMAGE_SIZE:-512}
      LOGIN_RATE_LIMIT_PER_WINDOW: ${LOGIN_RATE_LIMIT_PER_WINDOW:-10}
      CHECKOUT_RATE_LIMIT_PER_WINDOW: ${CHECKOUT_RATE_LIMIT_PER_WINDOW:-20}
      CHECKIN_RATE_LIMIT_PER_MINUTE: ${CHECKIN_RATE_LIMIT_PER_MINUTE:-240}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_FAIL_CLOSED: ${RATE_LIMIT_FAIL_CLOSED:-true}
      MAX_TICKETS_PER_ORDER: ${MAX_TICKETS_PER_ORDER:-20}
      CHECKOUT_SESSION_TTL: ${CHECKOUT_SESSION_TTL:-20m}
      MAIL_DELIVERY_SWEEP: ${MAIL_DELIVERY_SWEEP:-30000}
      MAIL_DELIVERY_CLEANUP_SWEEP: ${MAIL_DELIVERY_CLEANUP_SWEEP:-21600000}
      MAIL_DELIVERY_REPAIR_SWEEP: ${MAIL_DELIVERY_REPAIR_SWEEP:-30000}
      JWT_SECRET: ${JWT_SECRET}
      TICKET_VIEW_SECRET: ${TICKET_VIEW_SECRET}
      QR_SIGNING_SECRET: ${QR_SIGNING_SECRET}
      QR_SIGNING_SECRET_PREVIOUS: ${QR_SIGNING_SECRET_PREVIOUS:-}
      TICKET_VIEW_SECRET_PREVIOUS: ${TICKET_VIEW_SECRET_PREVIOUS:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_BASE_URL: ${RAZORPAY_BASE_URL:-https://api.razorpay.com/v1}
      PAYMENT_RECONCILIATION_AGE_MS: ${PAYMENT_RECONCILIATION_AGE_MS:-120000}
      PAYMENT_RECONCILIATION_SWEEP: ${PAYMENT_RECONCILIATION_SWEEP:-30000}
      CASHFREE_APP_ID: ${CASHFREE_APP_ID:-}
      CASHFREE_SECRET_KEY: ${CASHFREE_SECRET_KEY:-}
      CASHFREE_BASE_URL: ${CASHFREE_BASE_URL:-https://api.cashfree.com/pg}
      CASHFREE_API_VERSION: ${CASHFREE_API_VERSION:-2025-01-01}
      CASHFREE_RECONCILIATION_AGE_MS: ${CASHFREE_RECONCILIATION_AGE_MS:-120000}
      CASHFREE_RECONCILIATION_SWEEP: ${CASHFREE_RECONCILIATION_SWEEP:-30000}
      CASHFREE_CONNECT_TIMEOUT_MS: ${CASHFREE_CONNECT_TIMEOUT_MS:-3000}
      CASHFREE_READ_TIMEOUT_MS: ${CASHFREE_READ_TIMEOUT_MS:-8000}
      CASHFREE_WEBHOOK_TOLERANCE_MS: ${CASHFREE_WEBHOOK_TOLERANCE_MS:-300000}
      INITIAL_ADMIN_SETUP_ENABLED: ${INITIAL_ADMIN_SETUP_ENABLED:-false}
      INITIAL_ADMIN_SETUP_TOKEN: ${INITIAL_ADMIN_SETUP_TOKEN:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-neelastack-events}
      CLOUDINARY_MAX_BYTES: ${CLOUDINARY_MAX_BYTES:-5242880}
      NEELASTACK_PUBLIC_URL: ${NEELASTACK_PUBLIC_URL:-https://neelastack.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://events.neelastack.com}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://events.neelastack.com}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      BOOTSTRAP_ENABLED: ${BOOTSTRAP_ENABLED:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    networks: [lakhdatar_net]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --timeout=5 http://127.0.0.1:8080/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 90s
  web:
    image: ${IMAGE_NAMESPACE}/lakhdatar-web:${IMAGE_TAG}
    container_name: lakhdatar-web
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 512m
    cpus: "1.5"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      NODE_ENV: production
      PORT: "3000"
      SSR_API_BASE_URL: http://backend:8080/api/v1
      NG_ALLOWED_HOSTS: ${NG_ALLOWED_HOSTS:-events.neelastack.com,monitor.neelastack.com}
      NG_TRUST_PROXY_HEADERS: ${NG_TRUST_PROXY_HEADERS:-X-FORWARDED-FOR,X-FORWARDED-HOST,X-FORWARDED-PROTO}
    depends_on: {backend: {condition: service_healthy}}
    networks: [lakhdatar_net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 15s
  edge:
    image: ${IMAGE_NAMESPACE}/lakhdatar-edge:${IMAGE_TAG}
    container_name: lakhdatar-edge
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 256m
    cpus: "1.0"
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=32m,uid=101,gid=101,mode=0755
      - /tmp:rw,noexec,nosuid,size=8m
    depends_on:
      web: {condition: service_healthy}
      backend: {condition: service_healthy}
    networks: [lakhdatar_net]
    # Cloudflare Tunnel target: http://localhost:4002 (loopback only). Other apps on this VM keep their own ports and are never touched.
    ports: ["127.0.0.1:4002:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/edge-health >/dev/null"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 12

networks:
  lakhdatar_net:
    name: lakhdatar_net
volumes:
  lakhdatar_pg_data:
    name: lakhdatar_pg_data
  lakhdatar_redis_data:
    name: lakhdatar_redis_data
