# Reference scaling example. This file intentionally does not define PostgreSQL or Redis.
# Use managed/external HA services and inject DB_URL/REDIS_* through the runtime environment.
# Deploy one copy per VM; Cloudflare Load Balancing should health-check /edge-health.
name: lakhdatar-events-ha
services:
  backend:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    image: ${IMAGE_NAMESPACE}/lakhdatar-backend:${IMAGE_TAG}
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_ENV: production
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-lakhdatar-events-backend}
      DEFAULT_PAYMENT_PROVIDER: ${DEFAULT_PAYMENT_PROVIDER:-CASHFREE}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.version=2.0.26,deployment.environment=production}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.10}
      OTEL_SDK_ENABLED: ${OTEL_SDK_ENABLED:-true}
      OTEL_METRICS_EXPORT_ENABLED: ${OTEL_METRICS_EXPORT_ENABLED:-false}
      OPS_LOGS_ENABLED: ${OPS_LOGS_ENABLED:-false}
      LOKI_URL: ${LOKI_URL:-}
      APP_VERSION: ${APP_VERSION:-2.0.26}
      DB_URL: ${DB_URL:?DB_URL is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST is required}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_SSL: ${REDIS_SSL:-true}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER is required}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?JWT_AUDIENCE is required}
      MANAGEMENT_SERVER_PORT: ${MANAGEMENT_SERVER_PORT:-8081}
      TICKET_VIEW_SECRET: ${TICKET_VIEW_SECRET:?TICKET_VIEW_SECRET is required}
      TICKET_VIEW_TTL: ${TICKET_VIEW_TTL:-720h}
      QR_SIGNING_SECRET: ${QR_SIGNING_SECRET:?QR_SIGNING_SECRET is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      AUTH_COOKIE_SECURE: "true"
      RATE_LIMIT_FAIL_CLOSED: "true"
      NEELASTACK_PUBLIC_URL: ${NEELASTACK_PUBLIC_URL:?NEELASTACK_PUBLIC_URL is required}
      DB_POOL_MAX: ${API_DB_POOL_MAX:-16}
      DB_POOL_MIN: ${API_DB_POOL_MIN:-4}
      SERVER_TOMCAT_MAX_THREADS: ${SERVER_TOMCAT_MAX_THREADS:-200}
      SERVER_TOMCAT_MIN_SPARE_THREADS: ${SERVER_TOMCAT_MIN_SPARE_THREADS:-20}
      SERVER_TOMCAT_MAX_CONNECTIONS: ${SERVER_TOMCAT_MAX_CONNECTIONS:-10000}
      SERVER_TOMCAT_ACCEPT_COUNT: ${SERVER_TOMCAT_ACCEPT_COUNT:-1000}
      SERVER_TOMCAT_CONNECTION_TIMEOUT: ${SERVER_TOMCAT_CONNECTION_TIMEOUT:-5s}
      SERVER_TOMCAT_KEEP_ALIVE_TIMEOUT: ${SERVER_TOMCAT_KEEP_ALIVE_TIMEOUT:-30s}
      SERVER_TOMCAT_MAX_KEEP_ALIVE_REQUESTS: ${SERVER_TOMCAT_MAX_KEEP_ALIVE_REQUESTS:-100}
      PAYMENT_RECONCILIATION_AGE_MS: ${PAYMENT_RECONCILIATION_AGE_MS:-120000}
      PAYMENT_RECONCILIATION_SWEEP: ${PAYMENT_RECONCILIATION_SWEEP:-30000}
      PAYMENT_ORDER_RECOVERY_SWEEP: ${PAYMENT_ORDER_RECOVERY_SWEEP:-30000}
      RESERVATION_SWEEP: ${RESERVATION_SWEEP:-15000}
      RESERVATION_SWEEP_BATCH_SIZE: ${RESERVATION_SWEEP_BATCH_SIZE:-500}
      RESERVATION_SWEEP_MAX_BATCHES: ${RESERVATION_SWEEP_MAX_BATCHES:-8}
      REFUND_RECOVERY_SWEEP: ${REFUND_RECOVERY_SWEEP:-30000}
      REFUND_CANCELLATION_SWEEP: ${REFUND_CANCELLATION_SWEEP:-30000}
      REFUND_MAX_ATTEMPTS: ${REFUND_MAX_ATTEMPTS:-8}
      REFUND_CANCELLATION_BATCH_SIZE: ${REFUND_CANCELLATION_BATCH_SIZE:-500}
      REFUND_RECOVERY_BATCH_SIZE: ${REFUND_RECOVERY_BATCH_SIZE:-500}
      REFUND_RETRY_BASE_DELAY: ${REFUND_RETRY_BASE_DELAY:-30s}
      REFUND_RETRY_MAX_DELAY: ${REFUND_RETRY_MAX_DELAY:-6h}
      REFUND_PROCESSING_TIMEOUT: ${REFUND_PROCESSING_TIMEOUT:-24h}
      WEBHOOK_MAX_ATTEMPTS: ${WEBHOOK_MAX_ATTEMPTS:-12}
      WEBHOOK_RETRY_BASE_DELAY: ${WEBHOOK_RETRY_BASE_DELAY:-2s}
      WEBHOOK_RETRY_MAX_DELAY: ${WEBHOOK_RETRY_MAX_DELAY:-15m}
      WEBHOOK_RECOVERY_SWEEP: ${WEBHOOK_RECOVERY_SWEEP:-15000}
      WEBHOOK_RETENTION_DAYS: ${WEBHOOK_RETENTION_DAYS:-365}
      WEBHOOK_RETENTION_BATCH_SIZE: ${WEBHOOK_RETENTION_BATCH_SIZE:-500}
      WEBHOOK_RETENTION_SWEEP: ${WEBHOOK_RETENTION_SWEEP:-21600000}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_BASE_URL: ${RAZORPAY_BASE_URL:-https://api.razorpay.com/v1}
      CASHFREE_APP_ID: ${CASHFREE_APP_ID:-}
      CASHFREE_SECRET_KEY: ${CASHFREE_SECRET_KEY:-}
      CASHFREE_BASE_URL: ${CASHFREE_BASE_URL:-https://api.cashfree.com/pg}
      CASHFREE_API_VERSION: ${CASHFREE_API_VERSION:-2025-01-01}
      CASHFREE_WEBHOOK_TOLERANCE_MS: ${CASHFREE_WEBHOOK_TOLERANCE_MS:-300000}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-neelastack-events}
      CLOUDINARY_MAX_BYTES: ${CLOUDINARY_MAX_BYTES:-5242880}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      MFA_REQUIRED_FOR_PRIVILEGED: ${MFA_REQUIRED_FOR_PRIVILEGED:-true}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY is required when privileged MFA is enabled}
      MFA_ISSUER: ${MFA_ISSUER:-Neelastack Events}
      PASSWORD_RESET_CLEANUP_SWEEP: ${PASSWORD_RESET_CLEANUP_SWEEP:-21600000}
      MFA_CLEANUP_SWEEP: ${MFA_CLEANUP_SWEEP:-21600000}
      MAIL_DELIVERY_SWEEP: ${MAIL_DELIVERY_SWEEP:-30000}
      MAIL_DELIVERY_CLEANUP_SWEEP: ${MAIL_DELIVERY_CLEANUP_SWEEP:-21600000}
      MAIL_DELIVERY_REPAIR_SWEEP: ${MAIL_DELIVERY_REPAIR_SWEEP:-30000}
      WORKER_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --timeout=5 http://127.0.0.1:8081/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
  worker:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    image: ${IMAGE_NAMESPACE}/lakhdatar-backend:${IMAGE_TAG}
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      APP_ENV: production
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME_WORKER:-lakhdatar-events-worker}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.version=2.0.26,deployment.environment=production}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.10}
      OTEL_SDK_ENABLED: ${OTEL_SDK_ENABLED:-true}
      OTEL_METRICS_EXPORT_ENABLED: ${OTEL_METRICS_EXPORT_ENABLED:-false}
      OPS_LOGS_ENABLED: ${OPS_LOGS_ENABLED:-false}
      LOKI_URL: ${LOKI_URL:-}

      WORKER_ENABLED: "true"
      SCHEDULER_POOL_SIZE: ${SCHEDULER_POOL_SIZE:-8}
      DB_URL: ${DB_URL:?DB_URL is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST is required}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_SSL: ${REDIS_SSL:-true}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER is required}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?JWT_AUDIENCE is required}
      MANAGEMENT_SERVER_PORT: ${MANAGEMENT_SERVER_PORT:-8081}
      TICKET_VIEW_SECRET: ${TICKET_VIEW_SECRET:?TICKET_VIEW_SECRET is required}
      TICKET_VIEW_TTL: ${TICKET_VIEW_TTL:-720h}
      QR_SIGNING_SECRET: ${QR_SIGNING_SECRET:?QR_SIGNING_SECRET is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      AUTH_COOKIE_SECURE: "true"
      RATE_LIMIT_FAIL_CLOSED: "true"
      NEELASTACK_PUBLIC_URL: ${NEELASTACK_PUBLIC_URL:?NEELASTACK_PUBLIC_URL is required}
      DB_POOL_MAX: ${WORKER_DB_POOL_MAX:-8}
      DB_POOL_MIN: ${WORKER_DB_POOL_MIN:-2}
      PAYMENT_RECONCILIATION_AGE_MS: ${PAYMENT_RECONCILIATION_AGE_MS:-120000}
      PAYMENT_RECONCILIATION_SWEEP: ${PAYMENT_RECONCILIATION_SWEEP:-30000}
      PAYMENT_ORDER_RECOVERY_SWEEP: ${PAYMENT_ORDER_RECOVERY_SWEEP:-30000}
      RESERVATION_SWEEP: ${RESERVATION_SWEEP:-15000}
      RESERVATION_SWEEP_BATCH_SIZE: ${RESERVATION_SWEEP_BATCH_SIZE:-500}
      RESERVATION_SWEEP_MAX_BATCHES: ${RESERVATION_SWEEP_MAX_BATCHES:-8}
      REFUND_RECOVERY_SWEEP: ${REFUND_RECOVERY_SWEEP:-30000}
      REFUND_CANCELLATION_SWEEP: ${REFUND_CANCELLATION_SWEEP:-30000}
      REFUND_MAX_ATTEMPTS: ${REFUND_MAX_ATTEMPTS:-8}
      REFUND_CANCELLATION_BATCH_SIZE: ${REFUND_CANCELLATION_BATCH_SIZE:-500}
      REFUND_RECOVERY_BATCH_SIZE: ${REFUND_RECOVERY_BATCH_SIZE:-500}
      REFUND_RETRY_BASE_DELAY: ${REFUND_RETRY_BASE_DELAY:-30s}
      REFUND_RETRY_MAX_DELAY: ${REFUND_RETRY_MAX_DELAY:-6h}
      REFUND_PROCESSING_TIMEOUT: ${REFUND_PROCESSING_TIMEOUT:-24h}
      WEBHOOK_MAX_ATTEMPTS: ${WEBHOOK_MAX_ATTEMPTS:-12}
      WEBHOOK_RETRY_BASE_DELAY: ${WEBHOOK_RETRY_BASE_DELAY:-2s}
      WEBHOOK_RETRY_MAX_DELAY: ${WEBHOOK_RETRY_MAX_DELAY:-15m}
      WEBHOOK_RECOVERY_SWEEP: ${WEBHOOK_RECOVERY_SWEEP:-15000}
      WEBHOOK_RETENTION_DAYS: ${WEBHOOK_RETENTION_DAYS:-365}
      WEBHOOK_RETENTION_BATCH_SIZE: ${WEBHOOK_RETENTION_BATCH_SIZE:-500}
      WEBHOOK_RETENTION_SWEEP: ${WEBHOOK_RETENTION_SWEEP:-21600000}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_BASE_URL: ${RAZORPAY_BASE_URL:-https://api.razorpay.com/v1}
      CASHFREE_APP_ID: ${CASHFREE_APP_ID:-}
      CASHFREE_SECRET_KEY: ${CASHFREE_SECRET_KEY:-}
      CASHFREE_BASE_URL: ${CASHFREE_BASE_URL:-https://api.cashfree.com/pg}
      CASHFREE_API_VERSION: ${CASHFREE_API_VERSION:-2025-01-01}
      CASHFREE_WEBHOOK_TOLERANCE_MS: ${CASHFREE_WEBHOOK_TOLERANCE_MS:-300000}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      MFA_REQUIRED_FOR_PRIVILEGED: ${MFA_REQUIRED_FOR_PRIVILEGED:-true}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY is required when privileged MFA is enabled}
      MFA_ISSUER: ${MFA_ISSUER:-Neelastack Events}
      PASSWORD_RESET_CLEANUP_SWEEP: ${PASSWORD_RESET_CLEANUP_SWEEP:-21600000}
      MFA_CLEANUP_SWEEP: ${MFA_CLEANUP_SWEEP:-21600000}
      MAIL_DELIVERY_SWEEP: ${MAIL_DELIVERY_SWEEP:-30000}
      MAIL_DELIVERY_CLEANUP_SWEEP: ${MAIL_DELIVERY_CLEANUP_SWEEP:-21600000}
      MAIL_DELIVERY_REPAIR_SWEEP: ${MAIL_DELIVERY_REPAIR_SWEEP:-30000}

  web:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    image: ${IMAGE_NAMESPACE}/lakhdatar-web:${IMAGE_TAG}
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_VERSION: ${APP_VERSION:-2.0.26}
      SSR_API_BASE_URL: ${SSR_API_BASE_URL:-http://backend:8080/api/v1}
      NG_ALLOWED_HOSTS: ${NG_ALLOWED_HOSTS:?NG_ALLOWED_HOSTS is required}
      NG_TRUST_PROXY_HEADERS: X-FORWARDED-FOR,X-FORWARDED-HOST,X-FORWARDED-PROTO
      KEEP_ALIVE_TIMEOUT_MS: ${KEEP_ALIVE_TIMEOUT_MS:-60000}
      HEADERS_TIMEOUT_MS: ${HEADERS_TIMEOUT_MS:-65000}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-30000}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 12
  edge:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    image: ${IMAGE_NAMESPACE}/lakhdatar-edge:${IMAGE_TAG}
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 128
    ports: ["127.0.0.1:4002:8080"]
    volumes:
      - ./nginx-ha.conf.example:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=32m,uid=101,gid=101,mode=0755
      - /tmp:rw,noexec,nosuid,size=8m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/edge-health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 12
