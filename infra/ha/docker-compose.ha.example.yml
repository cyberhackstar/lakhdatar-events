# Reference scaling example. This file intentionally does not define PostgreSQL or Redis.
# Use managed/external HA services and inject DB_URL/REDIS_* through the runtime environment.
# Deploy one copy per VM; Cloudflare Load Balancing should health-check /edge-health.
name: lakhdatar-events-ha
services:
  backend:
    image: ${IMAGE_NAMESPACE}/lakhdatar-backend:${IMAGE_TAG}
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_ENV: production
      APP_VERSION: ${APP_VERSION:-1.9.48}
      DB_URL: ${DB_URL:?DB_URL is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST is required}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_SSL: ${REDIS_SSL:-true}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      TICKET_VIEW_SECRET: ${TICKET_VIEW_SECRET:?TICKET_VIEW_SECRET is required}
      QR_SIGNING_SECRET: ${QR_SIGNING_SECRET:?QR_SIGNING_SECRET is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      WORKER_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --timeout=5 http://127.0.0.1:8080/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
  worker:
    image: ${IMAGE_NAMESPACE}/lakhdatar-backend:${IMAGE_TAG}
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      APP_ENV: production
      WORKER_ENABLED: "true"
      DB_URL: ${DB_URL:?DB_URL is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST is required}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_SSL: ${REDIS_SSL:-true}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      TICKET_VIEW_SECRET: ${TICKET_VIEW_SECRET:?TICKET_VIEW_SECRET is required}
      QR_SIGNING_SECRET: ${QR_SIGNING_SECRET:?QR_SIGNING_SECRET is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      AUTH_COOKIE_SECURE: "true"
      RATE_LIMIT_FAIL_CLOSED: "true"
      NEELASTACK_PUBLIC_URL: ${NEELASTACK_PUBLIC_URL:?NEELASTACK_PUBLIC_URL is required}
      DB_POOL_MAX: ${WORKER_DB_POOL_MAX:-8}
      DB_POOL_MIN: ${WORKER_DB_POOL_MIN:-2}
      PAYMENT_RECONCILIATION_AGE_MS: ${PAYMENT_RECONCILIATION_AGE_MS:-120000}
      PAYMENT_RECONCILIATION_SWEEP: ${PAYMENT_RECONCILIATION_SWEEP:-30000}
      PAYMENT_ORDER_RECOVERY_SWEEP: ${PAYMENT_ORDER_RECOVERY_SWEEP:-30000}
      REFUND_RECOVERY_SWEEP: ${REFUND_RECOVERY_SWEEP:-30000}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_BASE_URL: ${RAZORPAY_BASE_URL:-https://api.razorpay.com/v1}
      CASHFREE_APP_ID: ${CASHFREE_APP_ID:-}
      CASHFREE_SECRET_KEY: ${CASHFREE_SECRET_KEY:-}
      CASHFREE_BASE_URL: ${CASHFREE_BASE_URL:-https://api.cashfree.com/pg}
      CASHFREE_API_VERSION: ${CASHFREE_API_VERSION:-2025-01-01}
      CASHFREE_WEBHOOK_TOLERANCE_MS: ${CASHFREE_WEBHOOK_TOLERANCE_MS:-300000}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      MAIL_DELIVERY_SWEEP: ${MAIL_DELIVERY_SWEEP:-30000}
      MAIL_DELIVERY_CLEANUP_SWEEP: ${MAIL_DELIVERY_CLEANUP_SWEEP:-21600000}
      MAIL_DELIVERY_REPAIR_SWEEP: ${MAIL_DELIVERY_REPAIR_SWEEP:-30000}

  web:
    image: ${IMAGE_NAMESPACE}/lakhdatar-web:${IMAGE_TAG}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_VERSION: ${APP_VERSION:-1.9.48}
      SSR_API_BASE_URL: ${SSR_API_BASE_URL:-http://backend:8080/api/v1}
      NG_ALLOWED_HOSTS: ${NG_ALLOWED_HOSTS:?NG_ALLOWED_HOSTS is required}
      NG_TRUST_PROXY_HEADERS: X-FORWARDED-FOR,X-FORWARDED-HOST,X-FORWARDED-PROTO
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 12
  edge:
    image: ${IMAGE_NAMESPACE}/lakhdatar-edge:${IMAGE_TAG}
    restart: unless-stopped
    ports: ["127.0.0.1:4002:8080"]
    volumes:
      - ./nginx-ha.conf.example:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=32m,uid=101,gid=101,mode=0755
      - /tmp:rw,noexec,nosuid,size=8m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/edge-health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 12
