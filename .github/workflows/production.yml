name: Production

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Production operation
        required: true
        type: choice
        default: deploy
        options:
          - deploy
          - rollback
      release_sha:
        description: 40-character Git SHA for manual operation
        required: false
        type: string
      confirm_single_node:
        description: Type SINGLE-NODE-BREAK-GLASS to explicitly accept single-node production risk
        required: false
        type: string

permissions:
  contents: read
  packages: read
  attestations: read
  actions: read

concurrency:
  group: lakhdatar-events-production
  cancel-in-progress: false

env:
  APP_DIR: /home/ubuntu/apps/lakhdatar-events
  PUBLIC_URL: https://events.neelastack.com

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Determine release SHA
        id: release
        shell: bash
        env:
          MANUAL_SHA: ${{ inputs.release_sha }}
          WORKFLOW_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_REF" == 'refs/heads/main' ]] || { echo '::error::Dispatch Production from main so the reviewed deployment workflow is used.'; exit 2; }
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$MANUAL_SHA" ]; then
            sha="$MANUAL_SHA"
          else
            sha="$GITHUB_SHA"
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Release SHA must be exactly 40 lowercase hex characters"; exit 2; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 1

      - name: Checkout trusted deployment controls at the workflow commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .deployment-control
          fetch-depth: 1

      - name: Require explicit single-node break-glass acknowledgement
        env:
          CONFIRM: ${{ inputs.confirm_single_node }}
        run: |
          set -euo pipefail
          # This workflow and its Compose deployment script are intentionally single-node only.
          # Enterprise HA uses production-ha.yml and its independent certification path.
          [[ "$CONFIRM" == "SINGLE-NODE-BREAK-GLASS" ]] || { echo 'Explicit SINGLE-NODE-BREAK-GLASS confirmation is required'; exit 1; }

      - name: Verify successful single-node readiness artifact for this exact release SHA
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: python3 .deployment-control/infra/certification/verify_production_readiness_artifact.py

      - name: Authenticate GitHub Actions runner to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          [[ "$GHCR_USER" =~ ^[A-Za-z0-9-]+$ ]] || { echo 'Invalid GHCR user name'; exit 2; }
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Install Cosign for immutable image verification
        uses: sigstore/cosign-installer@v4.1.2
      - name: Verify signed container images
        env:
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          identity="https://github.com/${REPOSITORY}/.github/workflows/ci.yml@refs/heads/main"
          for image in lakhdatar-backend lakhdatar-web lakhdatar-edge; do
            ref="ghcr.io/${OWNER}/${image}:${RELEASE_SHA}"
            cosign verify --certificate-identity "$identity" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$ref"
          done

      - name: Verify GitHub artifact attestations (public repositories only)
        if: github.event.repository.visibility == 'public'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          for image in lakhdatar-backend lakhdatar-web lakhdatar-edge; do
            ref="ghcr.io/${OWNER}/${image}:${RELEASE_SHA}"
            gh attestation verify "oci://$ref" -R "$REPOSITORY"
          done

      - name: Verify deployment secrets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "$DEPLOY_HOST" ] && missing+=(DEPLOY_HOST)
          [ -z "$DEPLOY_SSH_KEY" ] && missing+=(DEPLOY_SSH_KEY)
          [ -z "$DEPLOY_KNOWN_HOSTS" ] && missing+=(DEPLOY_KNOWN_HOSTS)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing deployment secrets: ${missing[*]}"
            exit 1
          fi

      - name: Configure SSH
        id: ssh_setup
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$DEPLOY_SSH_KEY" > deploy_key
          chmod 600 deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > known_hosts
          chmod 644 known_hosts
          ssh-keygen -y -f deploy_key >/dev/null

      - name: Authenticate Oracle VM to GHCR
        env:
          GITHUB_TOKEN_VALUE: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GHCR_USER" =~ ^[A-Za-z0-9-]+$ ]] || { echo 'Invalid GHCR user name'; exit 2; }
          printf '%s' "$GITHUB_TOKEN_VALUE" | ssh \
            -i deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=known_hosts \
            "$DEPLOY_HOST" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

      - name: Deploy exact immutable release
        id: deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          # Never archive runtime environment files even if a future change accidentally tracks one.
          tracked_runtime_envs="$(git ls-tree -r --name-only "$RELEASE_SHA" | grep -E '(^|/)\.env($|\.(production|staging|local|ha|prod|runtime)(\.|$))' | grep -Ev '\.example$|\.template$' || true)"
          if [ -n "$tracked_runtime_envs" ]; then
            echo '::error::Release commit tracks a runtime .env file; refusing to transfer it to production.' >&2
            exit 2
          fi
          # Export only the reviewed release commit. Never tar the Actions workspace: it contains
          # deploy_key/known_hosts and a separate trusted-control checkout.
          git archive --format=tar "$RELEASE_SHA" | gzip -1 | \
            ssh \
              -i deploy_key \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=known_hosts \
              "$DEPLOY_HOST" \
              "mkdir -p '$APP_DIR' && tar -xzf - -C '$APP_DIR' && chmod +x '$APP_DIR'/infra/deploy/*.sh '$APP_DIR'/infra/backup/*.sh && IMAGE_NAMESPACE=$(printf '%s' '$IMAGE_NAMESPACE' | tr '[:upper:]' '[:lower:]') '$APP_DIR'/infra/deploy/deploy.sh '$RELEASE_SHA'"

      - name: Production safe smoke test through Cloudflare
        env:
          BASE_URL: https://events.neelastack.com
          PUBLIC_HOST: events.neelastack.com
          # Public smoke coverage needs no privileged or ticket bearer credentials. The remote
          # deploy script can run optional authenticated/read-only checks from the VM's protected .env.
          SMOKE_ENTERPRISE: 'false'
          SMOKE_TICKET_PDF: 'false'
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if .deployment-control/infra/smoke/production-smoke.sh; then
              echo "Production safe smoke tests passed."
              exit 0
            fi
            sleep 6
          done
          echo "::error::Production safe smoke tests failed. Release remains deployed for diagnosis; automatic DB/schema rollback is intentionally disabled after Flyway." >&2
          exit 1

      - name: Log out of GHCR and clean SSH material
        if: always()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        shell: bash
        run: |
          set +e
          if [ -n "$DEPLOY_HOST" ] && [ -f deploy_key ] && [ -f known_hosts ]; then
            ssh -i deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=known_hosts "$DEPLOY_HOST" \
              "docker logout ghcr.io >/dev/null 2>&1 || true"
          fi
          rm -f deploy_key known_hosts

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'rollback' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Confirm trusted workflow ref and single-node rollback path
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_REF" == 'refs/heads/main' ]] || { echo '::error::Dispatch Production rollback from main.'; exit 2; }
          echo 'The production.yml rollback path invokes the single-node deploy script, which rejects enterprise-ha .env configuration.'

      - name: Verify deployment secrets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_SSH_KEY" ] && [ -n "$DEPLOY_KNOWN_HOSTS" ] || {
            echo "::error::DEPLOY_HOST, DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS are required"; exit 1;
          }

      - name: Configure SSH
        id: ssh_setup
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$DEPLOY_SSH_KEY" > deploy_key
          chmod 600 deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > known_hosts
          chmod 644 known_hosts
          ssh-keygen -y -f deploy_key >/dev/null

      - name: Authenticate Oracle VM to GHCR
        env:
          GITHUB_TOKEN_VALUE: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GHCR_USER" =~ ^[A-Za-z0-9-]+$ ]] || { echo 'Invalid GHCR user name'; exit 2; }
          printf '%s' "$GITHUB_TOKEN_VALUE" | ssh -i deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=known_hosts "$DEPLOY_HOST" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

      - name: Roll back to previous immutable release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=known_hosts "$DEPLOY_HOST" \
            "cd '$APP_DIR' && chmod +x ./infra/deploy/*.sh ./infra/backup/*.sh && IMAGE_NAMESPACE=$(printf '%s' '$IMAGE_NAMESPACE' | tr '[:upper:]' '[:lower:]') ./infra/deploy/rollback.sh"

      - name: Log out of GHCR and clean SSH material
        if: always()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        shell: bash
        run: |
          set +e
          if [ -n "$DEPLOY_HOST" ] && [ -f deploy_key ] && [ -f known_hosts ]; then
            ssh -i deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=known_hosts "$DEPLOY_HOST" \
              "docker logout ghcr.io >/dev/null 2>&1 || true"
          fi
          rm -f deploy_key known_hosts
