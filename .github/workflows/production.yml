name: Production

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Production operation
        required: true
        type: choice
        default: deploy
        options:
          - deploy
          - rollback
      release_sha:
        description: 40-character Git SHA for manual operation
        required: false
        type: string
      confirm_single_node:
        description: Type SINGLE-NODE-BREAK-GLASS to explicitly accept single-node production risk
        required: false
        type: string

permissions:
  contents: read
  packages: read
  attestations: read

concurrency:
  group: lakhdatar-events-production
  cancel-in-progress: false

env:
  APP_DIR: /home/ubuntu/apps/lakhdatar-events
  PUBLIC_URL: https://events.neelastack.com

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Determine release SHA
        id: release
        shell: bash
        env:
          MANUAL_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$MANUAL_SHA" ]; then
            sha="$MANUAL_SHA"
          else
            sha="$GITHUB_SHA"
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Release SHA must be exactly 40 lowercase hex characters"; exit 2; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 1

      - name: Require explicit single-node break-glass acknowledgement
        env:
          CONFIRM: ${{ inputs.confirm_single_node }}
          TOPOLOGY: ${{ vars.PRODUCTION_TOPOLOGY }}
        run: |
          set -euo pipefail
          [[ "$TOPOLOGY" != "enterprise-ha" ]] || { echo 'Enterprise HA releases must use production-ha.yml'; exit 1; }
          [[ "$CONFIRM" == "SINGLE-NODE-BREAK-GLASS" ]] || { echo 'Explicit SINGLE-NODE-BREAK-GLASS confirmation is required'; exit 1; }

      - name: Require enterprise certification for this exact release SHA
        env:
          CERTIFIED_RELEASE_SHA: ${{ vars.ENTERPRISE_CERTIFIED_SHA }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$CERTIFIED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Production deployment requires environment variable ENTERPRISE_CERTIFIED_SHA to be a 40-character immutable Git SHA that has passed release qualification."; exit 1; }
          [[ "$CERTIFIED_RELEASE_SHA" == "$RELEASE_SHA" ]] || { echo "::error::Release SHA $RELEASE_SHA is not the certified SHA $CERTIFIED_RELEASE_SHA. Run enterprise release qualification first."; exit 1; }

      - name: Install Cosign for immutable image verification
        uses: sigstore/cosign-installer@v4.1.2
      - name: Verify signed container images and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          identity="^https://github.com/${REPOSITORY}/.github/workflows/ci.yml@refs/heads/main$"
          for image in lakhdatar-backend lakhdatar-web lakhdatar-edge; do
            ref="ghcr.io/${OWNER}/${image}:${RELEASE_SHA}"
            cosign verify --certificate-identity-regexp "$identity" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$ref"
            gh attestation verify "oci://$ref" -R "$REPOSITORY"
          done

      - name: Verify deployment secrets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "$DEPLOY_HOST" ] && missing+=(DEPLOY_HOST)
          [ -z "$DEPLOY_SSH_KEY" ] && missing+=(DEPLOY_SSH_KEY)
          [ -z "$DEPLOY_KNOWN_HOSTS" ] && missing+=(DEPLOY_KNOWN_HOSTS)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing deployment secrets: ${missing[*]}"
            exit 1
          fi

      - name: Configure SSH
        id: ssh_setup
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$DEPLOY_SSH_KEY" > deploy_key
          chmod 600 deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > known_hosts
          chmod 644 known_hosts
          ssh-keygen -y -f deploy_key >/dev/null

      - name: Authenticate Oracle VM to GHCR
        env:
          GITHUB_TOKEN_VALUE: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN_VALUE" | ssh \
            -i deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=known_hosts \
            "$DEPLOY_HOST" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Deploy exact immutable release
        id: deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude='.git' --exclude='.env' --exclude='.deploy-current' --exclude='.deploy-previous' -czf - . | \
            ssh \
              -i deploy_key \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=known_hosts \
              "$DEPLOY_HOST" \
              "mkdir -p '$APP_DIR' && tar -xzf - -C '$APP_DIR' && chmod +x '$APP_DIR'/infra/deploy/*.sh '$APP_DIR'/infra/backup/*.sh && IMAGE_NAMESPACE=$(printf '%s' '$IMAGE_NAMESPACE' | tr '[:upper:]' '[:lower:]') '$APP_DIR'/infra/deploy/deploy.sh '$RELEASE_SHA'"

      - name: Production safe smoke test through Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if BASE_URL="$PUBLIC_URL" PUBLIC_HOST="events.neelastack.com" \
             SMOKE_TICKET_ID="${{ secrets.SMOKE_TICKET_ID }}" \
             SMOKE_TICKET_TOKEN="${{ secrets.SMOKE_TICKET_TOKEN }}" \
             SMOKE_TICKET_PDF="${{ vars.SMOKE_TICKET_PDF || 'false' }}" \
             SMOKE_ENTERPRISE="true" \
             infra/smoke/production-smoke.sh; then
              echo "Production safe smoke tests passed."
              exit 0
            fi
            sleep 6
          done
          echo "::error::Production safe smoke tests failed. Release remains deployed for diagnosis; automatic DB/schema rollback is intentionally disabled after Flyway." >&2
          exit 1

      - name: Log out of GHCR and clean SSH material
        if: always() && steps.ssh_setup.outcome == 'success'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        shell: bash
        run: |
          set +e
          ssh -i deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=known_hosts "$DEPLOY_HOST" \
            "docker logout ghcr.io >/dev/null 2>&1 || true"
          rm -f deploy_key known_hosts

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'rollback'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployment secrets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_SSH_KEY" ] && [ -n "$DEPLOY_KNOWN_HOSTS" ] || {
            echo "::error::DEPLOY_HOST, DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS are required"; exit 1;
          }

      - name: Configure SSH
        id: ssh_setup
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$DEPLOY_SSH_KEY" > deploy_key
          chmod 600 deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > known_hosts
          chmod 644 known_hosts
          ssh-keygen -y -f deploy_key >/dev/null

      - name: Authenticate Oracle VM to GHCR
        env:
          GITHUB_TOKEN_VALUE: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN_VALUE" | ssh -i deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=known_hosts "$DEPLOY_HOST" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Roll back to previous immutable release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=known_hosts "$DEPLOY_HOST" \
            "cd '$APP_DIR' && chmod +x ./infra/deploy/*.sh ./infra/backup/*.sh && IMAGE_NAMESPACE=$(printf '%s' '$IMAGE_NAMESPACE' | tr '[:upper:]' '[:lower:]') ./infra/deploy/rollback.sh"

      - name: Log out of GHCR and clean SSH material
        if: always() && steps.ssh_setup.outcome == 'success'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        shell: bash
        run: |
          set +e
          ssh -i deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=known_hosts "$DEPLOY_HOST" \
            "docker logout ghcr.io >/dev/null 2>&1 || true"
          rm -f deploy_key known_hosts
