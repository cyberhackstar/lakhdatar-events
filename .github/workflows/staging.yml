name: Staging Deploy

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 40-character Git SHA to deploy to isolated staging
        required: true
        type: string
      staging_host:
        description: Public staging hostname
        required: true
        default: staging-events.neelastack.com
        type: string

permissions:
  contents: read
  packages: read
  attestations: read

concurrency:
  group: lakhdatar-events-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1

      - name: Validate release and staging target
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          STAGING_HOST: ${{ inputs.staging_host }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'release_sha must be a 40-character lowercase Git SHA'; exit 2; }
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$STAGING_HOST" = "staging-events.neelastack.com"
          echo "Staging release: $RELEASE_SHA"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Verify signed release images
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          identity="^https://github.com/${REPOSITORY}/.github/workflows/ci.yml@refs/heads/main$"
          for image in lakhdatar-backend lakhdatar-web lakhdatar-edge; do
            ref="ghcr.io/${OWNER}/${image}:${RELEASE_SHA}"
            cosign verify --certificate-identity-regexp "$identity" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$ref"
            gh attestation verify "oci://$ref" -R "$REPOSITORY"
          done

      - name: Require staging deployment secrets
        env:
          STAGING_DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          STAGING_DEPLOY_SSH_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          STAGING_DEPLOY_KNOWN_HOSTS: ${{ secrets.STAGING_DEPLOY_KNOWN_HOSTS }}
          STAGING_ENV_FILE: ${{ secrets.STAGING_ENV_FILE }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$STAGING_DEPLOY_HOST" ]] || missing+=(STAGING_DEPLOY_HOST)
          [[ -n "$STAGING_DEPLOY_SSH_KEY" ]] || missing+=(STAGING_DEPLOY_SSH_KEY)
          [[ -n "$STAGING_DEPLOY_KNOWN_HOSTS" ]] || missing+=(STAGING_DEPLOY_KNOWN_HOSTS)
          [[ -n "$STAGING_ENV_FILE" ]] || missing+=(STAGING_ENV_FILE)
          if (( ${#missing[@]} )); then echo "::error::Missing staging secrets: ${missing[*]}"; exit 1; fi
          STAGING_ENV_NORMALIZED="$(printf '%s\n' "$STAGING_ENV_FILE" | tr -d '\r')"
          grep -q '^APP_ENV=staging$' <<<"$STAGING_ENV_NORMALIZED" || { echo 'STAGING_ENV_FILE must contain APP_ENV=staging'; exit 1; }
          grep -q '^PUBLIC_BASE_URL=https://staging-events.neelastack.com$' <<<"$STAGING_ENV_NORMALIZED" || { echo 'STAGING_ENV_FILE must set the staging public base URL'; exit 1; }
          grep -q '^CORS_ALLOWED_ORIGINS=https://staging-events.neelastack.com$' <<<"$STAGING_ENV_NORMALIZED" || { echo 'STAGING_ENV_FILE must set the staging CORS origin'; exit 1; }
          grep -q '^NG_ALLOWED_HOSTS=staging-events.neelastack.com$' <<<"$STAGING_ENV_NORMALIZED" || { echo 'STAGING_ENV_FILE must set the staging SSR host allowlist'; exit 1; }
          grep -q '^DB_URL=jdbc:postgresql://postgres:5432/lakhdatar_staging$' <<<"$STAGING_ENV_NORMALIZED" || { echo 'STAGING_ENV_FILE must use the isolated staging PostgreSQL service/database'; exit 1; }
          grep -q '^REDIS_HOST=redis$' <<<"$STAGING_ENV_NORMALIZED" || { echo 'STAGING_ENV_FILE must use the isolated staging Redis service'; exit 1; }
          grep -q '^REDIS_SSL=false$' <<<"$STAGING_ENV_NORMALIZED" || { echo 'STAGING_ENV_FILE must use the local isolated staging Redis transport'; exit 1; }
          ! grep -q 'https://events.neelastack.com' <<<"$STAGING_ENV_NORMALIZED" || { echo 'Production origin must not appear in STAGING_ENV_FILE'; exit 1; }
          ! grep -Eq '^CASHFREE_BASE_URL=https://api\.cashfree\.com/pg$' <<<"$STAGING_ENV_NORMALIZED" || { echo 'Staging Cashfree endpoint cannot be the production endpoint'; exit 1; }
          for entry in \
            'DB_PASSWORD|12' 'REDIS_PASSWORD|32' 'JWT_SECRET|32' 'TICKET_VIEW_SECRET|32' 'QR_SIGNING_SECRET|32' 'MFA_ENCRYPTION_KEY|32'; do
            key="${entry%%|*}"; min="${entry#*|}"
            value="$(printf '%s\n' "$STAGING_ENV_NORMALIZED" | sed -n "s/^${key}=//p" | tail -n1)"
            [[ -n "$value" && "$value" != '<'* && "$value" != replace-with-* && "$value" != change-me* && ${#value} -ge $min ]] || { echo "$key is missing or still a placeholder"; exit 1; }
          done
          provider_ok=0
          cashfree_id="$(printf '%s\n' "$STAGING_ENV_NORMALIZED" | sed -n 's/^CASHFREE_APP_ID=//p' | tail -n1)"
          cashfree_secret="$(printf '%s\n' "$STAGING_ENV_NORMALIZED" | sed -n 's/^CASHFREE_SECRET_KEY=//p' | tail -n1)"
          cashfree_url="$(printf '%s\n' "$STAGING_ENV_NORMALIZED" | sed -n 's/^CASHFREE_BASE_URL=//p' | tail -n1)"
          if [[ -n "$cashfree_id" || -n "$cashfree_secret" ]]; then
            [[ -n "$cashfree_id" && -n "$cashfree_secret" && -n "$cashfree_url" && "$cashfree_id" != '<'* && "$cashfree_secret" != '<'* && "$cashfree_url" != *api.cashfree.com/pg ]] || { echo 'Staging Cashfree credentials must be complete and use a non-production endpoint'; exit 1; }
            provider_ok=1
          fi
          razor_key="$(printf '%s\n' "$STAGING_ENV_NORMALIZED" | sed -n 's/^RAZORPAY_KEY_ID=//p' | tail -n1)"
          razor_secret="$(printf '%s\n' "$STAGING_ENV_NORMALIZED" | sed -n 's/^RAZORPAY_KEY_SECRET=//p' | tail -n1)"
          razor_webhook="$(printf '%s\n' "$STAGING_ENV_NORMALIZED" | sed -n 's/^RAZORPAY_WEBHOOK_SECRET=//p' | tail -n1)"
          [[ -z "$razor_key" || "$razor_key" == rzp_test_* ]] || { echo 'Staging Razorpay key must be a test key'; exit 1; }
          if [[ -n "$razor_key" || -n "$razor_secret" || -n "$razor_webhook" ]]; then
            [[ "$razor_key" == rzp_test_* && -n "$razor_secret" && -n "$razor_webhook" && "$razor_secret" != '<'* && "$razor_webhook" != '<'* ]] || { echo 'Staging Razorpay test credentials must be complete'; exit 1; }
            provider_ok=1
          fi
          [[ "$provider_ok" == 1 ]] || { echo 'At least one complete staging payment-provider sandbox credential set is required for enterprise qualification'; exit 1; }

      - name: Configure SSH
        env:
          STAGING_DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          STAGING_DEPLOY_SSH_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          STAGING_DEPLOY_KNOWN_HOSTS: ${{ secrets.STAGING_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          # STAGING_DEPLOY_HOST is the VM IP/hostname. The current deployment account is ubuntu.
          # Accept an already-prefixed ubuntu@host value for backward compatibility.
          [[ "$STAGING_DEPLOY_HOST" =~ ^[A-Za-z0-9._:@-]+$ ]] || { echo 'STAGING_DEPLOY_HOST contains invalid characters'; exit 2; }
          case "$STAGING_DEPLOY_HOST" in
            *@*) STAGING_SSH_TARGET="$STAGING_DEPLOY_HOST";;
            *)   STAGING_SSH_TARGET="ubuntu@$STAGING_DEPLOY_HOST";;
          esac
          echo "STAGING_SSH_TARGET=$STAGING_SSH_TARGET" >> "$GITHUB_ENV"
          printf '%s\n' "$STAGING_DEPLOY_SSH_KEY" > deploy_key
          chmod 600 deploy_key
          printf '%s\n' "$STAGING_DEPLOY_KNOWN_HOSTS" > known_hosts
          chmod 644 known_hosts
          ssh-keygen -y -f deploy_key >/dev/null

      - name: Verify staging VM prerequisites
        run: |
          set -euo pipefail
          ssh -i deploy_key -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=known_hosts "$STAGING_SSH_TARGET" \
            'set -eu; command -v docker >/dev/null; docker info >/dev/null; docker compose version >/dev/null; mkdir -p /home/ubuntu/apps/lakhdatar-events-staging; test -w /home/ubuntu/apps/lakhdatar-events-staging; echo Staging VM prerequisites OK'

      - name: Authenticate staging VM to GHCR
        env:
          GITHUB_TOKEN_VALUE: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN_VALUE" | ssh -i deploy_key -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=known_hosts "$STAGING_SSH_TARGET" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Install staging deployment files
        env:
          STAGING_ENV_FILE: ${{ secrets.STAGING_ENV_FILE }}
          OWNER: ${{ github.repository_owner }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          remote=/home/ubuntu/apps/lakhdatar-events-staging
          ssh -i deploy_key -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=known_hosts "$STAGING_SSH_TARGET" "mkdir -p '$remote/infra/deploy' '$remote/infra/smoke'"
          scp -i deploy_key -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=known_hosts infra/docker-compose.staging.yml "$STAGING_SSH_TARGET:$remote/infra/docker-compose.staging.yml"
          scp -i deploy_key -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=known_hosts infra/deploy/deploy-staging.sh "$STAGING_SSH_TARGET:$remote/infra/deploy/deploy-staging.sh"
          scp -i deploy_key -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=known_hosts infra/smoke/staging-smoke.sh "$STAGING_SSH_TARGET:$remote/infra/smoke/staging-smoke.sh"
          {
            printf '%s\n' "$STAGING_ENV_FILE" | tr -d '\r' | sed '/^IMAGE_NAMESPACE=/d;/^IMAGE_TAG=/d'
            printf 'IMAGE_NAMESPACE=ghcr.io/%s\n' "$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
            printf 'IMAGE_TAG=%s\n' "$RELEASE_SHA"
          } | ssh -i deploy_key -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=known_hosts "$STAGING_SSH_TARGET" "cat > '$remote/.env' && chmod 600 '$remote/.env'"
          ssh -i deploy_key -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=known_hosts "$STAGING_SSH_TARGET" "chmod +x '$remote/infra/deploy/deploy-staging.sh' '$remote/infra/smoke/staging-smoke.sh' && '$remote/infra/deploy/deploy-staging.sh' '$RELEASE_SHA'"

      - name: External HTTPS staging smoke
        env:
          STAGING_URL: https://staging-events.neelastack.com
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS --max-time 15 "$STAGING_URL/edge-health" >/dev/null && curl -fsS --max-time 15 "$STAGING_URL/robots.txt" >/dev/null; then
              echo "Staging HTTPS endpoint is healthy."
              exit 0
            fi
            sleep 4
          done
          echo '::error::Staging public HTTPS health check failed.'
          exit 1

      - name: Logout and clean SSH material
        if: always()
        run: |
          set +e
          if [[ -n "${STAGING_SSH_TARGET:-}" && -f deploy_key && -f known_hosts ]]; then
            ssh -i deploy_key -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=known_hosts "$STAGING_SSH_TARGET" 'docker logout ghcr.io >/dev/null 2>&1 || true'
          fi
          rm -f deploy_key known_hosts
