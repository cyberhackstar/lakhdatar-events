name: enterprise-e2e-staging

on:
  workflow_dispatch:
    inputs:
      run_mutations:
        description: Run stateful checkout/check-in tests against disposable staging data
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '30 21 * * 1-5'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Validate staging target
        env:
          E2E_BASE_URL: ${{ vars.STAGING_PUBLIC_URL || 'https://staging-events.neelastack.com' }}
        run: |
          set -euo pipefail
          if [ "$E2E_BASE_URL" = 'https://events.neelastack.com' ]; then
            echo 'Refusing live production origin' >&2
            exit 2
          fi
          test "$E2E_BASE_URL" = 'https://staging-events.neelastack.com' || { echo 'Enterprise E2E must target https://staging-events.neelastack.com' >&2; exit 2; }
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: npm ci
      - name: Run enterprise browser gate
        working-directory: e2e
        env:
          CI: 'true'
          E2E_ENV: staging
          E2E_RUN_MUTATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.run_mutations || false }}
          E2E_BASE_URL: ${{ vars.STAGING_PUBLIC_URL || 'https://staging-events.neelastack.com' }}
          E2E_ADMIN_BEARER: ${{ secrets.E2E_ADMIN_BEARER }}
          E2E_STAFF_BEARER: ${{ secrets.E2E_STAFF_BEARER }}
          E2E_EVENT_ID: ${{ secrets.E2E_EVENT_ID }}
          E2E_TICKET_TYPE_ID: ${{ secrets.E2E_TICKET_TYPE_ID }}
          E2E_CHECKOUT_EMAIL: ${{ secrets.E2E_CHECKOUT_EMAIL }}
          E2E_IDEMPOTENCY_KEY: ${{ secrets.E2E_IDEMPOTENCY_KEY }}
          E2E_TICKET_ID: ${{ secrets.E2E_TICKET_ID }}
          E2E_TICKET_TOKEN: ${{ secrets.E2E_TICKET_TOKEN }}
          E2E_QR_TOKEN: ${{ secrets.E2E_QR_TOKEN }}
          E2E_GATE: ${{ secrets.E2E_GATE }}
        run: npm test -- --reporter=line
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: enterprise-e2e-report
          path: e2e/playwright-report/
          if-no-files-found: ignore
