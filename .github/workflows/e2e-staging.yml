name: enterprise-e2e-staging

on:
  workflow_dispatch:
    inputs:
      run_mutations:
        description: Run stateful checkout/check-in tests (fixtures are created and cancelled automatically)
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "30 21 * * 1-5"

permissions:
  contents: read

# Prevent overlapping runs from consuming the same staging test data.
concurrency:
  group: neelastack-staging-qualification
  cancel-in-progress: false

jobs:
  e2e:
    name: Staging browser qualification
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate staging target
        env:
          E2E_BASE_URL: ${{ vars.STAGING_PUBLIC_URL || 'https://staging-events.neelastack.com' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$E2E_BASE_URL" == "https://events.neelastack.com" ||
                "$E2E_BASE_URL" == "https://www.events.neelastack.com" ]]; then
            echo "Refusing live production origin" >&2
            exit 2
          fi

          if [[ "$E2E_BASE_URL" != "https://staging-events.neelastack.com" ]]; then
            echo "E2E tests must target https://staging-events.neelastack.com." >&2
            exit 2
          fi

          echo "Staging target validated."

      - name: Validate provisioning input for full E2E runs
        env:
          E2E_RUN_MUTATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.run_mutations || false }}
          E2E_STAGING_PROVISIONING_CONFIG: ${{ secrets.E2E_STAGING_PROVISIONING_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$E2E_RUN_MUTATIONS" == "true" && -z "${E2E_STAGING_PROVISIONING_CONFIG:-}" ]]; then
            echo "Full staging E2E requires the dedicated E2E_STAGING_PROVISIONING_CONFIG secret containing only staging-safe E2E credentials and sandbox payment settings. Do not pass the deployment STAGING_ENV_FILE to this job. No fixture IDs or QR tokens are needed." >&2
            exit 2
          fi
          echo "Provisioning input check passed."

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers and system dependencies
        working-directory: e2e
        run: npm run playwright -- install --with-deps chromium webkit

      - name: Run enterprise browser gate
        working-directory: e2e
        env:
          CI: "true"
          E2E_ENV: staging
          E2E_RUN_MUTATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.run_mutations || false }}
          E2E_BASE_URL: ${{ vars.STAGING_PUBLIC_URL || 'https://staging-events.neelastack.com' }}

          # No hand-made fixtures: global-setup creates the event, tickets, staff and QR credential
          # This dedicated secret must contain only the E2E admin identity/MFA seed and sandbox
          # payment settings—not the deployment .env, database, JWT-signing, or SMTP secrets.
          E2E_STAGING_PROVISIONING_CONFIG: ${{ secrets.E2E_STAGING_PROVISIONING_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Verifying the provisioning logic against the in-process mock API."
          npm run selftest

          if [[ "$E2E_RUN_MUTATIONS" == "true" ]]; then
            echo "Full E2E suite requested. Fixtures will be provisioned automatically."
            npm test
          else
            echo "Running public security smoke tests only."
            echo "No checkout or check-in mutations will be requested by this test command."

            npm test -- tests/public-security.spec.js
          fi

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: enterprise-e2e-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
