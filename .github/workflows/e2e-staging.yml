name: enterprise-e2e-staging

on:
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * 1-5'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Validate staging target
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "$E2E_BASE_URL"
          case "$E2E_BASE_URL" in
            https://events.neelastack.com|https://events.neelastack.com/) echo 'Refusing live production origin' >&2; exit 2;;
          esac
          case "$E2E_BASE_URL" in https://*) ;; *) echo 'E2E_BASE_URL must use HTTPS' >&2; exit 2;; esac
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: npm ci
      - name: Run enterprise browser gate
        working-directory: e2e
        env:
          CI: 'true'
          E2E_ENV: staging
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_ADMIN_BEARER: ${{ secrets.E2E_ADMIN_BEARER }}
          E2E_STAFF_BEARER: ${{ secrets.E2E_STAFF_BEARER }}
          E2E_EVENT_ID: ${{ secrets.E2E_EVENT_ID }}
          E2E_TICKET_TYPE_ID: ${{ secrets.E2E_TICKET_TYPE_ID }}
          E2E_CHECKOUT_EMAIL: ${{ secrets.E2E_CHECKOUT_EMAIL }}
          E2E_IDEMPOTENCY_KEY: ${{ secrets.E2E_IDEMPOTENCY_KEY }}
          E2E_TICKET_ID: ${{ secrets.E2E_TICKET_ID }}
          E2E_TICKET_TOKEN: ${{ secrets.E2E_TICKET_TOKEN }}
          E2E_QR_TOKEN: ${{ secrets.E2E_QR_TOKEN }}
          E2E_GATE: ${{ secrets.E2E_GATE }}
        run: npm test -- --reporter=line
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: enterprise-e2e-report
          path: e2e/playwright-report/
          if-no-files-found: ignore
