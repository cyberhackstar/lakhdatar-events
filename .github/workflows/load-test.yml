name: Staging Load Test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'HTTPS staging base URL'
        required: true
        default: https://staging-events.neelastack.com
        type: string
      test:
        description: 'k6 scenario'
        required: true
        default: catalog.js
        type: choice
        options: [enterprise-gate, suite, catalog.js, burst.js, public-event.js, thousands.js, checkout.js, checkout-idempotency.js, checkin.js, ticket-pdf.js, operations.js, seo.js]

permissions:
  contents: read

jobs:
  load-test:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - name: Validate exact staging target
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: |
          set -euo pipefail
          test "$BASE_URL" = 'https://staging-events.neelastack.com' || { echo 'Staging Load Test must target https://staging-events.neelastack.com'; exit 2; }
        shell: bash
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install shared protected fixture provisioner dependencies
        working-directory: e2e
        run: npm ci
      - name: Run selected staging load scenario (automatic fixtures when required)
        env:
          BASE_URL: ${{ inputs.base_url }}
          LOADTEST_SCENARIO: ${{ inputs.test }}
          K6_IMAGE: "grafana/k6:2.2.0@sha256:9bd01d6941fca969cb61bb57d2da5ee9b385fe2aa8881df3798c196564d6ace6"
          E2E_STAGING_PROVISIONING_CONFIG: ${{ secrets.E2E_STAGING_PROVISIONING_CONFIG }}
          STAGING_DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          STAGING_DEPLOY_SSH_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          STAGING_DEPLOY_KNOWN_HOSTS: ${{ secrets.STAGING_DEPLOY_KNOWN_HOSTS }}
          THOUSANDS_MAX_VUS: ${{ vars.LOADTEST_THOUSANDS_MAX_VUS || '1000' }}
          THOUSANDS_RAMP: ${{ vars.LOADTEST_THOUSANDS_RAMP || '2m' }}
          THOUSANDS_HOLD: ${{ vars.LOADTEST_THOUSANDS_HOLD || '3m' }}
          CHECKOUT_TARGET_RATE: ${{ vars.LOADTEST_CHECKOUT_TARGET_RATE || '100' }}
          CHECKIN_RATE: ${{ vars.LOADTEST_CHECKIN_RATE || '2' }}
          CHECKIN_DURATION: ${{ vars.LOADTEST_CHECKIN_DURATION || '2m' }}
          RATE: ${{ vars.LOADTEST_RATE || '50' }}
          DURATION: ${{ vars.LOADTEST_DURATION || '2m' }}
          ALLOW_PRODUCTION_CHECKOUT_LOAD: 'false'
        run: node ./infra/loadtest/auto-runner.cjs "$LOADTEST_SCENARIO"
      - name: Upload k6 summaries
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: lakhdatar-k6-${{ github.run_id }}
          path: loadtest-results/*.json
          if-no-files-found: warn
