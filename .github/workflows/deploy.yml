name: Deploy Oracle VM

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# Only one production deployment at a time; never cancel one mid-flight.
concurrency:
  group: lakhdatar-events-production
  cancel-in-progress: false

env:
  APP_DIR: /home/ubuntu/apps/lakhdatar-events
  PUBLIC_URL: https://events.neelastack.com

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Determine release SHA
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}

      # Keep the deployment secret contract identical to the proven Neelastack deployment flow.
      # DEPLOY_HOST must include the SSH user, e.g. ubuntu@203.0.113.10.
      - name: Verify deployment secrets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "$DEPLOY_HOST" ] && missing+=("DEPLOY_HOST")
          [ -z "$DEPLOY_SSH_KEY" ] && missing+=("DEPLOY_SSH_KEY")
          [ -z "$DEPLOY_KNOWN_HOSTS" ] && missing+=("DEPLOY_KNOWN_HOSTS")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing deployment secrets: ${missing[*]}"
            exit 1
          fi

      - name: Configure SSH
        id: ssh_setup
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$DEPLOY_SSH_KEY" > deploy_key
          chmod 600 deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > known_hosts
          chmod 644 known_hosts

          # Keep key/host verification strict, matching the previous production project.
          ssh-keygen -y -f deploy_key >/dev/null

      - name: Authenticate Oracle VM to GHCR with GitHub token
        env:
          GITHUB_TOKEN_VALUE: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN_VALUE" |
            ssh \
              -i deploy_key \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=known_hosts \
              "$DEPLOY_HOST" \
              "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Deploy exact commit SHA to Oracle VM
        id: deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # The VM keeps its production .env outside Git. The application repository is
          # checked out in-place, exactly like the previous Neelastack deployment flow.
          ssh \
            -i deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=known_hosts \
            "$DEPLOY_HOST" \
            "cd '$APP_DIR' && git fetch --force origin main && git reset --hard '$RELEASE_SHA' && chmod +x ./infra/deploy/*.sh ./infra/backup/*.sh && IMAGE_NAMESPACE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]') ./infra/deploy/deploy.sh '$RELEASE_SHA'"

      - name: Public health check (through Cloudflare)
        id: public_health
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if curl -fsS --max-time 15 "$PUBLIC_URL/" >/dev/null \
               && curl -fsS --max-time 15 "$PUBLIC_URL/api/v1/public/events/upcoming" >/dev/null \
               && curl -fsS --max-time 15 "$PUBLIC_URL/sitemap.xml" >/dev/null; then
              echo "Public health checks passed."
              exit 0
            fi
            sleep 6
          done
          echo "::error::Public health checks failed after deployment."
          exit 1

      - name: Roll back on failed public health check
        if: failure() && steps.deploy.outcome == 'success' && steps.public_health.outcome == 'failure'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=known_hosts \
            "$DEPLOY_HOST" \
            "cd '$APP_DIR' && chmod +x ./infra/deploy/*.sh ./infra/backup/*.sh && IMAGE_NAMESPACE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]') ./infra/deploy/rollback.sh"
          exit 1

      - name: Log out of GHCR and clean SSH material
        if: always() && steps.ssh_setup.outcome == 'success'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        shell: bash
        run: |
          set +e
          ssh \
            -i deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=known_hosts \
            "$DEPLOY_HOST" \
            "docker logout ghcr.io >/dev/null 2>&1 || true"
          rm -f deploy_key known_hosts
