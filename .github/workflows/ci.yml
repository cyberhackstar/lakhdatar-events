name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 2 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Action majors are kept current; the Trivy action is pinned to its immutable v0.36.0 commit.
jobs:
  security:
    # Runs on PR/push and as the weekly security sweep. Keeping the sweep here avoids a second workflow.
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify checkout load-test target guard
        run: bash infra/loadtest/test-checkout-target-guard.sh
      - name: Verify checkout load failure diagnostics are bounded and sanitized
        run: bash infra/loadtest/test-checkout-load-diagnostics.sh
      - name: Verify enterprise certification evidence gate
        run: bash infra/certification/test-verify-enterprise-evidence.sh
      - name: Verify release qualification and production certification separation
        run: bash infra/certification/test-certification-workflow-separation.sh
      - name: Verify load-test rates respect edge limits
        run: bash infra/loadtest/test-scenario-rate-limits.sh
      - name: Verify scanner check-in latency SLO contract
        run: bash infra/loadtest/test-checkin-thresholds.sh
      - name: Verify bounded reservation-expiry invariant retry
        run: bash infra/loadtest/test-invariant-expiry-retry.sh
      - name: Verify just-in-time load-test access-token refresh
        run: node infra/loadtest/test-refresh-access-token.cjs
      - name: Verify load-test token refresh wiring
        run: bash infra/loadtest/test-loadtest-token-refresh-wiring.sh
      - name: Verify single-owner HSTS smoke contract
        run: bash infra/smoke/test-hsts-ownership.sh
      - name: Verify security and automatic-fixture source contracts
        run: node tools/verify-security-policy.mjs
      - name: Verify private-repository release workflow compatibility
        run: bash infra/certification/test-private-repo-workflow-compat.sh
      - name: Verify staging browser failure artifact contract
        run: node infra/certification/test-browser-artifact-contract.mjs
      - name: Verify staging deployment package contract
        run: bash infra/certification/test-staging-deploy-package.sh
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - name: Verify frontend dependency lock before install
        working-directory: frontend
        run: npm run verify:dependencies
      - name: Frontend full dependency security audit
        working-directory: frontend
        # DevDependencies participate in the build/test supply chain and are therefore audited
        # separately from the production runtime dependency audit below.
        run: npm ci --ignore-scripts --no-audit --no-fund && npm audit --audit-level=high
      - name: Frontend production dependency audit
        working-directory: frontend
        # Audit the dependency tree that is actually shipped in the production SSR image.
        # The Docker runtime stage installs only production dependencies; the full build/test
        # supply chain is audited separately immediately above.
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund && npm audit --omit=dev --audit-level=high
      - name: Filesystem vulnerability and misconfiguration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"
          format: table

  codeql:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [java, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 21 for CodeQL Java build
        if: matrix.language == 'java'
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Set up Node for CodeQL JavaScript/TypeScript build context
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.2
        with:
          languages: ${{ matrix.language }}
      - name: Build Java for CodeQL
        if: matrix.language == 'java'
        working-directory: backend
        run: mvn -B -ntp -DskipTests compile
      - name: Analyze
        uses: github/codeql-action/analyze@v4.38.2
        with:
          # Private repositories on plans without Code Security cannot upload SARIF to the
          # GitHub code-scanning API. Keep analysis enabled and retain results as an artifact.
          output: codeql-results
          upload: never
          upload-database: false
      - name: Preserve CodeQL SARIF for private-repository review
        if: success()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: codeql-sarif-${{ matrix.language }}-${{ github.run_id }}
          path: codeql-results/
          if-no-files-found: error
          retention-days: 14

  backend:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        working-directory: backend
        run: mvn -B -ntp clean verify

  frontend:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify Neelastack stability baseline
        working-directory: frontend
        run: npm run verify:baseline
      - name: Verify frontend dependency lock
        working-directory: frontend
        run: npm run verify:dependencies
      - name: Install dependencies and build (production, SSR)
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test
      - name: Validate production frontend build
        working-directory: frontend
        run: |
          set -euo pipefail
          test -f dist/frontend/server/server.mjs
          test -f dist/frontend/browser/assets/og-default.png
          test -s dist/frontend/browser/assets/neelastack-logo.png
          if grep -rl "localhost:8081" dist/frontend/browser; then
            echo "Dev API URL leaked into production bundle" >&2
            exit 1
          fi
          if grep -rEl "events\.neelastack\.com:8080|http://events\.neelastack\.com" dist/frontend/browser; then
            echo "Public backend URL leaked into production browser bundle" >&2
            exit 1
          fi
      - name: Smoke-test Angular SSR server
        working-directory: frontend
        run: |
          set -euo pipefail
          PORT=3000 SSR_API_BASE_URL=http://127.0.0.1:8080/api/v1 \
            NG_ALLOWED_HOSTS=127.0.0.1,localhost,events.neelastack.com,monitor.neelastack.com \
            NG_TRUST_PROXY_HEADERS=X-FORWARDED-FOR,X-FORWARDED-HOST,X-FORWARDED-PROTO \
            node dist/frontend/server/server.mjs > /tmp/lakhdatar-ssr.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/healthz >/dev/null && \
               curl -fsS http://127.0.0.1:3000/ | grep -q '<title>'; then
              echo "Angular SSR smoke test passed."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lakhdatar-ssr.log
          echo "::error::Angular SSR server did not pass health/HTML smoke tests"
          exit 1

  docker:
    needs: [backend, frontend, security, codeql]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4.2.0
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend multi-architecture image
        id: push-backend
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lakhdatar-backend:${{ github.sha }}
          provenance: true
          sbom: true
      - name: Build and push web multi-architecture image
        id: push-web
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lakhdatar-web:${{ github.sha }}
          provenance: true
          sbom: true
      - name: Build and push edge multi-architecture image
        id: push-edge
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./edge
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lakhdatar-edge:${{ github.sha }}
          provenance: true
          sbom: true

      - name: Regression-test edge container startup
        env:
          EDGE_IMAGE: ghcr.io/${{ github.repository_owner }}/lakhdatar-edge:${{ github.sha }}
        run: |
          set -euo pipefail
          container=lakhdatar-edge-regression
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d \
            --name "$container" \
            --add-host backend:127.0.0.1 \
            --add-host web:127.0.0.1 \
            -p 127.0.0.1:18082:8080 \
            "$EDGE_IMAGE" >/dev/null
          ready=0
          for i in $(seq 1 20); do
            if curl -fsS --max-time 3 http://127.0.0.1:18082/edge-health >/dev/null; then
              ready=1
              echo "Edge container startup regression test passed."
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker inspect "$container" || true
            docker logs "$container" || true
            echo "::error::Edge image failed startup/readiness regression test"
            exit 1
          fi
          location=$(curl -fsSI --max-time 3 -H 'Host: monitor.neelastack.com' http://127.0.0.1:18082/ | awk -F': ' 'tolower($1)=="location" {gsub("\r", "", $2); print $2; exit}')
          test "$location" = "/monitor" || {
            echo "::error::Monitor canonical redirect mismatch: $location"
            docker logs "$container" || true
            exit 1
          }
          echo "Monitor canonical redirect regression test passed."
          # Dedicated monitor hostname must not expose business HTML, ticket URLs or generic APIs.
          for url in \
            /admin/operations \
            /api/v1/public/events/featured \
            /api/v1/orders \
            /ticket/ci-monitor-isolation; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 3 -H 'Host: monitor.neelastack.com' "http://127.0.0.1:18082${url}")
            test "$code" = "404" || {
              echo "::error::Monitor isolation regression: ${url} returned ${code}, expected 404"
              docker logs "$container" || true
              exit 1
            }
          done
          echo "Monitor business-route isolation regression test passed."
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 3 -H 'Host: events.neelastack.com' http://127.0.0.1:18082/monitor)
          test "$code" = "404" || {
            echo "::error::Events host exposed dedicated monitor route: ${code}"
            docker logs "$container" || true
            exit 1
          }
          echo "Monitor host boundary regression test passed."

      - name: Install Trivy once for all image scans
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # pinned setup-trivy revision
        with:
          version: v0.70.0
          cache: true
          token: ${{ github.token }}

      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/lakhdatar-backend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"
          timeout: 15m0s
          scanners: vuln,secret
          vuln-type: os,library
          version: v0.70.0
          skip-setup-trivy: true
          cache: true

      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/lakhdatar-web:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"
          timeout: 15m0s
          scanners: vuln,secret
          vuln-type: os,library
          version: v0.70.0
          skip-setup-trivy: true
          cache: true

      - name: Scan edge image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/lakhdatar-edge:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"
          timeout: 15m0s
          scanners: vuln,secret
          vuln-type: os,library
          version: v0.70.0
          skip-setup-trivy: true
          cache: true

      - name: Generate backend GitHub artifact attestation
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/lakhdatar-backend
          subject-digest: ${{ steps.push-backend.outputs.digest }}
          push-to-registry: true
      - name: Generate web GitHub artifact attestation
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/lakhdatar-web
          subject-digest: ${{ steps.push-web.outputs.digest }}
          push-to-registry: true
      - name: Generate edge GitHub artifact attestation
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/lakhdatar-edge
          subject-digest: ${{ steps.push-edge.outputs.digest }}
          push-to-registry: true

      - name: Verify GitHub artifact provenance (public repositories only)
        if: github.event.repository.visibility == 'public'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          for image in lakhdatar-backend lakhdatar-web lakhdatar-edge; do
            gh attestation verify \
              "oci://ghcr.io/${OWNER}/${image}:${SHA}" \
              -R "${REPOSITORY}"
          done

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0
      - name: Sign immutable release images
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for image in lakhdatar-backend lakhdatar-web lakhdatar-edge; do
            cosign sign --yes "ghcr.io/${OWNER}/${image}:${SHA}"
          done

      - name: Verify Cosign signatures for immutable release images
        env:
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          identity="^https://github.com/${REPOSITORY}/\.github/workflows/ci\.yml@refs/heads/main$"
          for image in lakhdatar-backend lakhdatar-web lakhdatar-edge; do
            ref="ghcr.io/${OWNER}/${image}:${SHA}"
            cosign verify --certificate-identity-regexp "$identity" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$ref"
          done
