name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dependency_review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Dependency audit (frontend)
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund && npm audit --audit-level=high
      - name: Filesystem vulnerability and misconfiguration scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '1'
          format: table

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [java, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Analyze
        uses: github/codeql-action/analyze@v3

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        working-directory: backend
        run: mvn -B -ntp clean verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify Neelastack stability baseline
        working-directory: frontend
        run: npm run verify:baseline
      - name: Install dependencies and build (production, SSR)
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test
      - name: Validate production frontend build
        working-directory: frontend
        run: |
          test -f dist/frontend/server/server.mjs
          test -f dist/frontend/browser/assets/og-default.png
          if grep -rl "localhost:8081" dist/frontend/browser; then echo "Dev API URL leaked into production bundle" >&2; exit 1; fi

  docker:
    needs: [backend, frontend, security]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lakhdatar-backend:${{ github.sha }}
          provenance: true
          sbom: true
      - name: Build and push web (Angular SSR) ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lakhdatar-web:${{ github.sha }}
          provenance: true
          sbom: true
      - name: Build and push edge (nginx) ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: ./edge
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lakhdatar-edge:${{ github.sha }}
          provenance: true
          sbom: true
      - name: Scan backend image for high/critical vulnerabilities
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/lakhdatar-backend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '1'
      - name: Scan web image for high/critical vulnerabilities
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/lakhdatar-web:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '1'
      - name: Scan edge image for high/critical vulnerabilities
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/lakhdatar-edge:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '1'
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0
      - name: Verify and sign immutable release images
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for image in lakhdatar-backend lakhdatar-web lakhdatar-edge; do
            ref="ghcr.io/${OWNER}/${image}:${SHA}"
            cosign verify-attestation --type slsaprovenance --certificate-identity-regexp 'https://github.com/.*/.github/workflows/.*' --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' "$ref" >/dev/null
            cosign sign --yes "$ref"
          done
