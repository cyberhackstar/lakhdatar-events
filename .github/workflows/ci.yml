name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 2 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Action majors are kept current; the Trivy action is pinned to its immutable v0.36.0 commit.
jobs:
  security:
    # Runs on PR/push and as the weekly security sweep. Keeping the sweep here avoids a second workflow.
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Frontend dependency audit
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund && npm audit --audit-level=high
      - name: Filesystem vulnerability and misconfiguration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '1'
          format: table

  codeql:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [java, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.2
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.38.2
      - name: Analyze
        uses: github/codeql-action/analyze@v4.38.2

  backend:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        working-directory: backend
        run: mvn -B -ntp clean verify

  frontend:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify Neelastack stability baseline
        working-directory: frontend
        run: npm run verify:baseline
      - name: Install dependencies and build (production, SSR)
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test
      - name: Validate production frontend build
        working-directory: frontend
        run: |
          set -euo pipefail
          test -f dist/frontend/server/server.mjs
          test -f dist/frontend/browser/assets/og-default.png
          if grep -rl "localhost:8081" dist/frontend/browser; then
            echo "Dev API URL leaked into production bundle" >&2
            exit 1
          fi
      - name: Smoke-test Angular SSR server
        working-directory: frontend
        run: |
          set -euo pipefail
          PORT=3000 SSR_API_BASE_URL=http://127.0.0.1:8080/api/v1 \
            node dist/frontend/server/server.mjs > /tmp/lakhdatar-ssr.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/healthz >/dev/null && \
               curl -fsS http://127.0.0.1:3000/ | grep -q '<title>'; then
              echo "Angular SSR smoke test passed."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lakhdatar-ssr.log
          echo "::error::Angular SSR server did not pass health/HTML smoke tests"
          exit 1

  docker:
    needs: [backend, frontend, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4.2.0
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend multi-architecture image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lakhdatar-backend:${{ github.sha }}
          provenance: true
          sbom: true
      - name: Build and push web multi-architecture image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lakhdatar-web:${{ github.sha }}
          provenance: true
          sbom: true
      - name: Build and push edge multi-architecture image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./edge
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lakhdatar-edge:${{ github.sha }}
          provenance: true
          sbom: true

      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/lakhdatar-backend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '1'
      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/lakhdatar-web:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '1'
      - name: Scan edge image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/lakhdatar-edge:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '1'

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0
      - name: Verify provenance and sign immutable release images
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for image in lakhdatar-backend lakhdatar-web lakhdatar-edge; do
            ref="ghcr.io/${OWNER}/${image}:${SHA}"
            cosign verify-attestation \
              --type slsaprovenance \
              --certificate-identity-regexp 'https://github.com/.*/.github/workflows/.*' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$ref" >/dev/null
            cosign sign --yes "$ref"
          done
