name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        working-directory: backend
        run: mvn -B -ntp clean verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify Neelastack stability baseline
        working-directory: frontend
        run: npm run verify:baseline
      - name: Install dependencies and build (production, SSR)
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test
      - name: Validate production frontend build
        working-directory: frontend
        run: |
          test -f dist/frontend/server/server.mjs
          test -f dist/frontend/browser/assets/og-default.png
          if grep -rl "localhost:8081" dist/frontend/browser; then echo "Dev API URL leaked into production bundle" >&2; exit 1; fi

  docker:
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lakhdatar-backend:${{ github.sha }}
      - name: Build and push web (Angular SSR) ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lakhdatar-web:${{ github.sha }}
      - name: Build and push edge (nginx) ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: ./edge
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lakhdatar-edge:${{ github.sha }}
