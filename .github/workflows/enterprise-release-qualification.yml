name: Enterprise Release Qualification

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 40-character Git SHA to qualify
        required: true
        type: string
      staging_url:
        description: HTTPS staging origin using disposable test data
        required: true
        default: https://staging-events.neelastack.com
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: neelastack-staging-qualification
  cancel-in-progress: false

jobs:
  source-validation:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          # The qualification job verifies ancestry against the complete main history.
          fetch-depth: 0
      - name: Validate exact release SHA and main ancestry
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main' || { echo '::error::Enterprise Release Qualification must be dispatched from main.'; exit 2; }
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'release_sha must be a 40-character lowercase Git SHA'; exit 2; }
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git show-ref --verify --quiet refs/remotes/origin/main || { echo '::error::origin/main is missing from the full-history checkout.'; exit 2; }
          git merge-base --is-ancestor "$RELEASE_SHA" refs/remotes/origin/main || { echo '::error::The candidate release SHA is not reachable from main; refusing to run secret-bearing staging qualification.'; exit 2; }
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Checkout trusted release-policy checks at workflow commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .qualification-control
          fetch-depth: 1
      - name: Verify repository baselines and launch-critical legal content
        run: |
          set -euo pipefail
          node tools/verify-platform-baseline.mjs
          node tools/verify-frontend-lock.mjs
          python3 .qualification-control/infra/certification/test_check_production_content_readiness.py
          python3 .qualification-control/infra/certification/check_production_content_readiness.py --source frontend/src/app/features/legal/legal.config.ts

  staging-release-identity:
    if: github.ref == 'refs/heads/main'
    name: Verify requested SHA is deployed to staging
    needs: [source-validation]
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - name: Validate exact staging release and public target
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          STAGING_URL: ${{ inputs.staging_url }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'release_sha must be a 40-character lowercase Git SHA'; exit 2; }
          [[ "$STAGING_URL" == 'https://staging-events.neelastack.com' ]] || { echo 'Release qualification must target https://staging-events.neelastack.com'; exit 2; }

      - name: Configure read-only staging SSH check
        env:
          STAGING_DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          STAGING_DEPLOY_SSH_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          STAGING_DEPLOY_KNOWN_HOSTS: ${{ secrets.STAGING_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in STAGING_DEPLOY_HOST STAGING_DEPLOY_SSH_KEY STAGING_DEPLOY_KNOWN_HOSTS; do
            [[ -n "${!name}" ]] || { echo "Missing staging SSH secret: $name"; exit 1; }
          done
          [[ "$STAGING_DEPLOY_HOST" =~ ^[A-Za-z0-9._:@-]+$ ]] || { echo 'STAGING_DEPLOY_HOST contains invalid characters'; exit 2; }
          case "$STAGING_DEPLOY_HOST" in
            *@*) STAGING_SSH_TARGET="$STAGING_DEPLOY_HOST" ;;
            *) STAGING_SSH_TARGET="ubuntu@$STAGING_DEPLOY_HOST" ;;
          esac
          echo "STAGING_SSH_TARGET=$STAGING_SSH_TARGET" >> "$GITHUB_ENV"
          printf '%s\n' "$STAGING_DEPLOY_SSH_KEY" > deploy_key
          chmod 600 deploy_key
          printf '%s\n' "$STAGING_DEPLOY_KNOWN_HOSTS" > known_hosts
          chmod 644 known_hosts
          ssh-keygen -y -f deploy_key >/dev/null

      - name: Require exact successful staging deployment marker
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid release SHA'; exit 2; }
          ssh -i deploy_key -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=known_hosts "$STAGING_SSH_TARGET" "RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          marker='/home/ubuntu/apps/lakhdatar-events-staging/.deploy-current'
          deployed="$(cat "$marker" 2>/dev/null || true)"
          if [[ "$deployed" != "$RELEASE_SHA" ]]; then
            echo 'Staging deployment marker does not match the requested release SHA.' >&2
            echo "Requested SHA: $RELEASE_SHA" >&2
            echo "Deployed SHA: ${deployed:-<missing>}" >&2
            exit 1
          fi
          echo "Staging deployment marker matches requested release SHA: $RELEASE_SHA"
          REMOTE

      - name: Clean staging SSH material
        if: always()
        run: rm -f deploy_key known_hosts

  database:
    if: github.ref == 'refs/heads/main'
    needs: source-validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
      - name: Enterprise Flyway fresh-and-upgrade qualification
        env:
          POSTGRES_IMAGE: "${{ vars.POSTGRES_CERTIFICATION_IMAGE || 'postgres:17-alpine@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995' }}"
          FLYWAY_IMAGE: "${{ vars.FLYWAY_CERTIFICATION_IMAGE || 'flyway/flyway:13.8.0-alpine@sha256:533745f3b566788a3ba7e5bb238a4596cf96a3a4c4531b5efca20962ef5ff3b8' }}"
          EXPECTED_LATEST_MIGRATION: '41'
          UPGRADE_BASELINE_MIGRATION: '31'
        run: bash ./infra/certification/flyway-qualification.sh
      - name: Upload database evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: enterprise-database-${{ inputs.release_sha }}
          path: certification-evidence/database/
          if-no-files-found: error

  backend:
    if: github.ref == 'refs/heads/main'
    needs: source-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Backend full verification
        working-directory: backend
        run: mvn -B -ntp clean verify

  frontend:
    if: github.ref == 'refs/heads/main'
    needs: source-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend dependency install
        working-directory: frontend
        run: npm ci
      - name: Frontend production build
        working-directory: frontend
        run: npm run build
      - name: Frontend unit suite
        working-directory: frontend
        run: npm run test:unit

  browser-e2e:
    if: github.ref == 'refs/heads/main'
    needs: [backend, frontend, staging-release-identity]
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci
      - name: Validate staging target
        env:
          E2E_BASE_URL: ${{ inputs.staging_url }}
        run: |
          set -euo pipefail
          test "$E2E_BASE_URL" = 'https://staging-events.neelastack.com' || { echo 'Enterprise release qualification must target https://staging-events.neelastack.com'; exit 2; }
        shell: bash
      - name: Validate staging E2E provisioning input
        env:
          E2E_STAGING_PROVISIONING_CONFIG: ${{ secrets.E2E_STAGING_PROVISIONING_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${E2E_STAGING_PROVISIONING_CONFIG:-}" ]]; then
            echo "Browser qualification requires E2E_STAGING_PROVISIONING_CONFIG; do not expose deployment STAGING_ENV_FILE. Fixture IDs and tokens are generated automatically." >&2
            exit 2
          fi

      - name: Run browser qualification
        working-directory: e2e
        env:
          CI: 'true'
          E2E_ENV: staging
          E2E_RUN_MUTATIONS: 'true'
          E2E_BASE_URL: ${{ inputs.staging_url }}
          # Dedicated least-privilege config; never expose the deployment STAGING_ENV_FILE here.
          E2E_STAGING_PROVISIONING_CONFIG: ${{ secrets.E2E_STAGING_PROVISIONING_CONFIG }}
        run: |
          npm run selftest
          # Use the configured line + HTML reporters so the HTML report is actually generated.
          npm test
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: enterprise-browser-${{ inputs.release_sha }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: warn

  load:
    if: github.ref == 'refs/heads/main'
    # Keep synthetic user-facing/browser actions and load traffic from contending on staging.
    needs: [backend, frontend, browser-e2e, staging-release-identity]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      # The deployed application is bound by inputs.release_sha and the staging marker above.
      # The load-test harness is a separate, reviewed input: pin it to this workflow dispatch SHA
      # so test-only fixes can re-qualify the existing staged release without rebuilding/redeploying it.
      - name: Checkout qualification harness at the workflow commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: qualification-harness
          fetch-depth: 1
      - name: Validate staging target and immutable harness identity
        env:
          BASE_URL: ${{ inputs.staging_url }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          EXPECTED_HARNESS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$BASE_URL" = 'https://staging-events.neelastack.com' || { echo 'Enterprise load qualification must target https://staging-events.neelastack.com'; exit 2; }
          test "$GITHUB_REF" = 'refs/heads/main' || { echo 'Dispatch Enterprise Release Qualification from main so the reviewed harness is used.'; exit 2; }
          actual_harness_sha="$(git -C qualification-harness rev-parse HEAD)"
          test "$actual_harness_sha" = "$EXPECTED_HARNESS_SHA" || { echo 'Qualification harness SHA does not match the workflow dispatch commit.'; exit 2; }
          echo "Application release SHA: $RELEASE_SHA"
          echo "Qualification harness SHA: $actual_harness_sha"
      - uses: actions/setup-node@v7
        with:
          node-version-file: qualification-harness/.nvmrc
          cache: npm
          cache-dependency-path: qualification-harness/e2e/package-lock.json
      - name: Install shared protected fixture provisioner dependencies
        working-directory: qualification-harness/e2e
        run: npm ci
      - name: Run automatic enterprise load qualification
        working-directory: qualification-harness
        env:
          BASE_URL: ${{ inputs.staging_url }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          QUALIFICATION_HARNESS_SHA: ${{ github.sha }}
          K6_IMAGE: "${{ vars.K6_IMAGE || 'grafana/k6:2.2.0@sha256:9bd01d6941fca969cb61bb57d2da5ee9b385fe2aa8881df3798c196564d6ace6' }}"
          E2E_STAGING_PROVISIONING_CONFIG: ${{ secrets.E2E_STAGING_PROVISIONING_CONFIG }}
          STAGING_DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          STAGING_DEPLOY_SSH_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          STAGING_DEPLOY_KNOWN_HOSTS: ${{ secrets.STAGING_DEPLOY_KNOWN_HOSTS }}
          THOUSANDS_MAX_VUS: ${{ vars.LOADTEST_THOUSANDS_MAX_VUS || '1000' }}
          THOUSANDS_RAMP: ${{ vars.LOADTEST_THOUSANDS_RAMP || '2m' }}
          THOUSANDS_HOLD: ${{ vars.LOADTEST_THOUSANDS_HOLD || '3m' }}
          CHECKOUT_TARGET_RATE: ${{ vars.LOADTEST_CHECKOUT_TARGET_RATE || '100' }}
          PDF_RATE: ${{ vars.LOADTEST_PDF_RATE || '15' }}
          OPERATIONS_RATE: ${{ vars.LOADTEST_OPERATIONS_RATE || '4' }}
          ALLOW_PRODUCTION_CHECKOUT_LOAD: 'false'
        run: node ./infra/loadtest/auto-runner.cjs enterprise-gate
      - name: Upload load-test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: enterprise-load-${{ inputs.release_sha }}-${{ github.sha }}
          path: qualification-harness/loadtest-results/
          if-no-files-found: warn

  dast:
    if: github.ref == 'refs/heads/main'
    needs: [backend, frontend, staging-release-identity]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
      - name: Run immutable-image DAST
        env:
          BASE_URL: ${{ inputs.staging_url }}
          ZAP_IMAGE: "${{ secrets.ZAP_IMAGE || 'zaproxy/zap-stable:2.17.0@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef' }}"
        run: bash ./infra/security/dast-staging.sh
      - name: Upload DAST evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: enterprise-dast-${{ inputs.release_sha }}
          path: security-results/
          if-no-files-found: warn

  certification:
    if: github.ref == 'refs/heads/main'
    name: Release qualification result (not production certification)
    needs: [backend, frontend, database, staging-release-identity, browser-e2e, load, dast]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
      - name: Write release qualification manifest
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          QUALIFICATION_RUN_ID: ${{ github.run_id }}
          QUALIFICATION_RUN_ATTEMPT: ${{ github.run_attempt }}
          QUALIFICATION_HARNESS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid release SHA' >&2; exit 2; }
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          mkdir -p qualification-evidence
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          document = {
              "schemaVersion": 1,
              "manifestType": "release-qualification-not-production-certification",
              "status": "PASS",
              "releaseSha": os.environ["RELEASE_SHA"],
              "testHarnessSha": os.environ["QUALIFICATION_HARNESS_SHA"],
              "workflowName": "Enterprise Release Qualification",
              "runId": os.environ["QUALIFICATION_RUN_ID"],
              "runAttempt": int(os.environ["QUALIFICATION_RUN_ATTEMPT"]),
              "qualifiedAtUtc": datetime.now(timezone.utc).isoformat(),
              "gates": ["source-validation", "backend", "frontend", "database", "staging-release-identity", "browser-e2e", "load", "dast"],
              "productionCertificationGranted": False,
          }
          Path("qualification-evidence/release-qualification.json").write_text(json.dumps(document, indent=2) + "\n")
          print("Release qualification manifest written; no production certification has been granted.")
          PY
      - name: Upload release qualification manifest
        uses: actions/upload-artifact@v7
        with:
          name: release-qualification-${{ inputs.release_sha }}
          path: qualification-evidence/release-qualification.json
          if-no-files-found: error
