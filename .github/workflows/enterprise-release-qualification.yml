name: Enterprise Release Qualification

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 40-character Git SHA to qualify
        required: true
        type: string
      staging_url:
        description: HTTPS staging origin using disposable test data
        required: true
        default: https://staging-events.neelastack.com
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: neelastack-staging-qualification
  cancel-in-progress: false

jobs:
  source-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
      - name: Validate exact release SHA
        run: |
          set -euo pipefail
          [[ '${{ inputs.release_sha }}' =~ ^[0-9a-f]{40}$ ]] || { echo 'release_sha must be a 40-character lowercase Git SHA'; exit 2; }
          grep -qx '${{ inputs.release_sha }}' <(git rev-parse HEAD)
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Verify repository baselines
        run: |
          set -euo pipefail
          node tools/verify-platform-baseline.mjs
          node tools/verify-frontend-lock.mjs

  database:
    needs: source-validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
      - name: Enterprise Flyway fresh-and-upgrade qualification
        env:
          POSTGRES_IMAGE: "${{ vars.POSTGRES_CERTIFICATION_IMAGE || 'postgres:17-alpine@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995' }}"
          FLYWAY_IMAGE: "${{ vars.FLYWAY_CERTIFICATION_IMAGE || 'flyway/flyway:13.8.0-alpine@sha256:533745f3b566788a3ba7e5bb238a4596cf96a3a4c4531b5efca20962ef5ff3b8' }}"
          EXPECTED_LATEST_MIGRATION: '41'
          UPGRADE_BASELINE_MIGRATION: '31'
        run: bash ./infra/certification/flyway-qualification.sh
      - name: Upload database evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: enterprise-database-${{ inputs.release_sha }}
          path: certification-evidence/database/
          if-no-files-found: error

  backend:
    needs: source-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Backend full verification
        working-directory: backend
        run: mvn -B -ntp clean verify

  frontend:
    needs: source-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend dependency install
        working-directory: frontend
        run: npm ci
      - name: Frontend production build
        working-directory: frontend
        run: npm run build
      - name: Frontend unit suite
        working-directory: frontend
        run: npm run test:unit

  browser-e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci
      - name: Validate staging target
        env:
          E2E_BASE_URL: ${{ inputs.staging_url }}
        run: |
          set -euo pipefail
          test "$E2E_BASE_URL" = 'https://staging-events.neelastack.com' || { echo 'Enterprise release qualification must target https://staging-events.neelastack.com'; exit 2; }
        shell: bash
      - name: Validate staging E2E provisioning input
        env:
          E2E_STAGING_PROVISIONING_CONFIG: ${{ secrets.E2E_STAGING_PROVISIONING_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${E2E_STAGING_PROVISIONING_CONFIG:-}" ]]; then
            echo "Browser qualification requires E2E_STAGING_PROVISIONING_CONFIG; do not expose deployment STAGING_ENV_FILE. Fixture IDs and tokens are generated automatically." >&2
            exit 2
          fi

      - name: Run browser qualification
        working-directory: e2e
        env:
          CI: 'true'
          E2E_ENV: staging
          E2E_RUN_MUTATIONS: 'true'
          E2E_BASE_URL: ${{ inputs.staging_url }}
          # Dedicated least-privilege config; never expose the deployment STAGING_ENV_FILE here.
          E2E_STAGING_PROVISIONING_CONFIG: ${{ secrets.E2E_STAGING_PROVISIONING_CONFIG }}
        run: |
          npm run selftest
          npm test -- --reporter=line
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: enterprise-browser-${{ inputs.release_sha }}
          path: e2e/playwright-report/
          if-no-files-found: warn

  load:
    # Keep synthetic user-facing/browser actions and load traffic from contending on staging.
    needs: [backend, frontend, browser-e2e]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
      - name: Validate exact staging target
        env:
          BASE_URL: ${{ inputs.staging_url }}
        run: |
          set -euo pipefail
          test "$BASE_URL" = 'https://staging-events.neelastack.com' || { echo 'Enterprise load qualification must target https://staging-events.neelastack.com'; exit 2; }
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install shared protected fixture provisioner dependencies
        working-directory: e2e
        run: npm ci
      - name: Run automatic enterprise load qualification
        env:
          BASE_URL: ${{ inputs.staging_url }}
          K6_IMAGE: "${{ vars.K6_IMAGE || 'grafana/k6:2.2.0@sha256:9bd01d6941fca969cb61bb57d2da5ee9b385fe2aa8881df3798c196564d6ace6' }}"
          E2E_STAGING_PROVISIONING_CONFIG: ${{ secrets.E2E_STAGING_PROVISIONING_CONFIG }}
          STAGING_DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          STAGING_DEPLOY_SSH_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          STAGING_DEPLOY_KNOWN_HOSTS: ${{ secrets.STAGING_DEPLOY_KNOWN_HOSTS }}
          THOUSANDS_MAX_VUS: ${{ vars.LOADTEST_THOUSANDS_MAX_VUS || '1000' }}
          THOUSANDS_RAMP: ${{ vars.LOADTEST_THOUSANDS_RAMP || '2m' }}
          THOUSANDS_HOLD: ${{ vars.LOADTEST_THOUSANDS_HOLD || '3m' }}
          CHECKOUT_TARGET_RATE: ${{ vars.LOADTEST_CHECKOUT_TARGET_RATE || '100' }}
          ALLOW_PRODUCTION_CHECKOUT_LOAD: 'false'
        run: node ./infra/loadtest/auto-runner.cjs enterprise-gate
      - name: Upload load-test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: enterprise-load-${{ inputs.release_sha }}
          path: loadtest-results/
          if-no-files-found: warn

  dast:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
      - name: Run immutable-image DAST
        env:
          BASE_URL: ${{ inputs.staging_url }}
          ZAP_IMAGE: "${{ secrets.ZAP_IMAGE || 'zaproxy/zap-stable:2.17.0@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef' }}"
        run: bash ./infra/security/dast-staging.sh
      - name: Upload DAST evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: enterprise-dast-${{ inputs.release_sha }}
          path: security-results/
          if-no-files-found: warn

  enterprise-evidence:
    needs: [backend, frontend, database, browser-e2e, load, dast]
    runs-on: ubuntu-latest
    environment: enterprise-certification
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
      - name: Verify protected enterprise evidence
        env:
          CERTIFIED_SHA: ${{ inputs.release_sha }}
          PRODUCTION_TOPOLOGY: ${{ vars.PRODUCTION_TOPOLOGY }}
          HA_NODE_COUNT: ${{ vars.HA_NODE_COUNT }}
          RPO_SECONDS: ${{ vars.RPO_SECONDS }}
          RTO_SECONDS: ${{ vars.RTO_SECONDS }}
          MAX_RPO_SECONDS: ${{ vars.MAX_RPO_SECONDS || '300' }}
          MAX_RTO_SECONDS: ${{ vars.MAX_RTO_SECONDS || '1800' }}
          HA_FAILOVER_EVIDENCE_ID: ${{ vars.HA_FAILOVER_EVIDENCE_ID }}
          PITR_EVIDENCE_ID: ${{ vars.PITR_EVIDENCE_ID }}
          PEN_TEST_EVIDENCE_ID: ${{ vars.PEN_TEST_EVIDENCE_ID }}
          PAYMENT_CHAOS_EVIDENCE_ID: ${{ vars.PAYMENT_CHAOS_EVIDENCE_ID }}
          ALERTING_EVIDENCE_ID: ${{ vars.ALERTING_EVIDENCE_ID }}
          FINANCE_RECONCILIATION_EVIDENCE_ID: ${{ vars.FINANCE_RECONCILIATION_EVIDENCE_ID }}
          PRIVACY_REVIEW_EVIDENCE_ID: ${{ vars.PRIVACY_REVIEW_EVIDENCE_ID }}
          MFA_EVIDENCE_ID: ${{ vars.MFA_EVIDENCE_ID }}
          HA_FAILOVER_STATUS: ${{ vars.HA_FAILOVER_STATUS }}
          PITR_STATUS: ${{ vars.PITR_STATUS }}
          PEN_TEST_STATUS: ${{ vars.PEN_TEST_STATUS }}
          PAYMENT_CHAOS_STATUS: ${{ vars.PAYMENT_CHAOS_STATUS }}
          ALERTING_STATUS: ${{ vars.ALERTING_STATUS }}
          FINANCE_RECONCILIATION_STATUS: ${{ vars.FINANCE_RECONCILIATION_STATUS }}
          PRIVACY_REVIEW_STATUS: ${{ vars.PRIVACY_REVIEW_STATUS }}
          MFA_STATUS: ${{ vars.MFA_STATUS }}
        run: bash ./infra/certification/verify-enterprise-evidence.sh
      - name: Upload certification manifest
        uses: actions/upload-artifact@v7.0.2
        with:
          name: enterprise-certification-${{ inputs.release_sha }}
          path: certification-evidence/enterprise-certification.json
          if-no-files-found: error

  certification:
    needs: [backend, frontend, database, browser-e2e, load, dast, enterprise-evidence]
    runs-on: ubuntu-latest
    steps:
      - name: Enterprise certification result
        run: |
          set -euo pipefail
          echo "CERTIFIED_SHA=${{ inputs.release_sha }}"
          echo "Application, database, browser, load, DAST and protected enterprise-evidence gates passed."
          echo "The protected enterprise-certification environment is the authorization boundary for ENTERPRISE_CERTIFIED_SHA."
