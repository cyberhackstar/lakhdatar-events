# Edge for events.neelastack.com. Cloudflare Tunnel -> host 127.0.0.1:4002 -> this container (:8080).
# Routes: /api, /robots.txt, /sitemap.xml -> Spring Boot backend; everything else -> Angular SSR web.

# The host port is loopback-only, so CF-Connecting-IP is trusted at this private edge boundary.
map $http_cf_connecting_ip $client_rate_key {
    default $http_cf_connecting_ip;
    "" $binary_remote_addr;
}
map $http_x_forwarded_proto $public_proto { default $scheme; https https; http http; }
limit_req_zone $client_rate_key zone=public_api:10m rate=20r/s;
limit_req_zone $client_rate_key zone=auth_api:10m rate=5r/s;
limit_conn_zone $client_rate_key zone=per_ip:10m;

log_format edge_json escape=json '{"time":"$time_iso8601","request_id":"$request_id","status":$status,"method":"$request_method","uri":"$uri","remote_ip":"$client_rate_key","request_time":$request_time,"upstream_time":"$upstream_response_time","host":"$host"}';

# Cloudflare terminates TLS. Trust its forwarded scheme so generated URLs are https, never http/localhost.
server {
    access_log /dev/stdout edge_json;
    error_log /dev/stderr warn;
    limit_conn per_ip 40;
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 6m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com https://sdk.cashfree.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://api.razorpay.com https://checkout.razorpay.com https://lumberjack.razorpay.com https://api.cashfree.com https://sdk.cashfree.com; frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com https://sdk.cashfree.com https://payments.cashfree.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_rate_key;
    proxy_set_header X-Forwarded-For $client_rate_key;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $public_proto;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_connect_timeout 5s;

    location = /edge-health { access_log off; default_type text/plain; return 200 "ok\n"; }

    location ^~ /api/v1/auth/ {
        limit_req zone=auth_api burst=10 nodelay;
        proxy_pass http://backend:8080;
        proxy_send_timeout 15s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    location ^~ /api/ {
        limit_req zone=public_api burst=40 nodelay;
        proxy_pass http://backend:8080;
        proxy_send_timeout 15s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    location = /robots.txt  { proxy_pass http://backend:8080; proxy_read_timeout 10s; }
    location = /sitemap.xml { proxy_pass http://backend:8080; proxy_read_timeout 10s; }

    location ^~ /ticket/ {
        access_log off;   # ticket access tokens may appear in URLs
        proxy_pass http://web:3000;
        proxy_read_timeout 20s;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_read_timeout 20s;
    }
}
