# Edge for events.neelastack.com. Cloudflare Tunnel -> host 127.0.0.1:4002 -> this container (:80).
# Routes: /api, /robots.txt, /sitemap.xml -> Spring Boot backend; everything else -> Angular SSR web.

# Cloudflare terminates TLS. Trust its forwarded scheme so generated URLs are https, never http/localhost.
map $http_x_forwarded_proto $public_proto { default $scheme; https https; http http; }

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://api.razorpay.com https://checkout.razorpay.com https://lumberjack.razorpay.com; frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $public_proto;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_connect_timeout 5s;

    location = /edge-health { access_log off; default_type text/plain; return 200 "ok\n"; }

    location ^~ /api/ {
        # API URLs can carry short-lived ticket access tokens; keep them out of access logs.
        access_log off;
        proxy_pass http://backend:8080;
        proxy_send_timeout 15s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    location = /robots.txt  { proxy_pass http://backend:8080; proxy_read_timeout 10s; }
    location = /sitemap.xml { proxy_pass http://backend:8080; proxy_read_timeout 10s; }

    location ^~ /ticket/ {
        access_log off;   # ticket access tokens may appear in URLs
        proxy_pass http://web:3000;
        proxy_read_timeout 20s;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_read_timeout 20s;
    }
}
