# Edge for events.neelastack.com + monitor.neelastack.com. Cloudflare Tunnel -> host 127.0.0.1:4002 -> this container (:8080).
# Business traffic and the dedicated SRE monitor share the private edge while remaining host/routing separated.

# The host port is loopback-only, so CF-Connecting-IP is trusted at this private edge boundary.
# IMPORTANT: this value is forwarded upstream as X-Real-IP / X-Forwarded-For, so it MUST be printable text.
# Never fall back to $binary_remote_addr here: raw bytes in an HTTP header make Node/Tomcat reject the request
# with "400 Bad Request" (this broke the v1.9.20 post-deploy smoke test, which calls 127.0.0.1:4002 directly
# without a Cloudflare CF-Connecting-IP header). Only accept a well-formed IPv4/IPv6 literal from the header.
map $http_cf_connecting_ip $client_rate_key {
    default $remote_addr;
    "~^[0-9A-Fa-f:.]{3,45}$" $http_cf_connecting_ip;
}
map $http_x_forwarded_proto $public_proto { default $scheme; https https; http http; }
map $host $monitor_root_redirect { default 0; monitor.neelastack.com 1; }
map $host $is_monitor_host { default 0; monitor.neelastack.com 1; }
map $http_x_correlation_id $edge_correlation_id {
    "~^[A-Za-z0-9._-]{8,80}$" $http_x_correlation_id;
    default $request_id;
}
limit_req_zone $client_rate_key zone=public_api:10m rate=20r/s;
limit_req_zone $client_rate_key zone=public_catalog_api:10m rate=1200r/s;
limit_req_zone $client_rate_key zone=auth_api:10m rate=5r/s;
limit_req_zone $client_rate_key zone=ops_logs_api:10m rate=2r/s;
limit_conn_zone $client_rate_key zone=per_ip:10m;

# Reuse origin TCP connections instead of opening a new backend/web socket per request.
upstream backend_upstream {
    server backend:8080 max_fails=3 fail_timeout=5s;
    keepalive 64;
}
upstream web_upstream {
    server web:3000 max_fails=3 fail_timeout=5s;
    keepalive 32;
}

# Small, bounded micro-cache for public event catalogue reads. Checkout/ticket/admin paths are never under this prefix.
proxy_cache_path /var/cache/nginx/public-cache levels=1:2 keys_zone=public_catalog:20m max_size=24m inactive=60s use_temp_path=off;
proxy_cache_key "$scheme$request_method$host$request_uri";
proxy_cache_lock on;
proxy_cache_background_update on;

# Compress text/JSON at the edge before it crosses the Cloudflare tunnel.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types application/json application/javascript application/xml text/plain text/css text/javascript image/svg+xml;

log_format edge_json escape=json '{"time":"$time_iso8601","request_id":"$request_id","status":$status,"method":"$request_method","uri":"$uri","remote_ip":"$client_rate_key","request_time":$request_time,"upstream_time":"$upstream_response_time","host":"$host","correlation_id":"$edge_correlation_id"}';

# Cloudflare terminates TLS. Trust its forwarded scheme so generated URLs are https, never http/localhost.
server {
    access_log /dev/stdout edge_json;
    error_log /dev/stderr warn;
    limit_conn per_ip 1000;
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 6m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy 'camera=(self), microphone=(), geolocation=(), payment=(self "https://api.cashfree.com" "https://payments.cashfree.com" "https://checkout.razorpay.com")' always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com https://sdk.cashfree.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://api.razorpay.com https://checkout.razorpay.com https://lumberjack.razorpay.com https://api.cashfree.com https://sdk.cashfree.com; frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com https://sdk.cashfree.com https://payments.cashfree.com https://api.cashfree.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' https://api.cashfree.com https://payments.cashfree.com;" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_rate_key;
    proxy_set_header X-Forwarded-For $client_rate_key;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $public_proto;
    proxy_set_header CF-Connecting-IP $client_rate_key;
    proxy_set_header X-Correlation-ID $edge_correlation_id;
    proxy_connect_timeout 5s;

    location = /edge-health { access_log off; default_type text/plain; return 200 "ok\n"; }

    # Dedicated operator hostname. Keep the origin private behind Cloudflare Tunnel and
    # redirect only the monitor hostname root to the dedicated SRE console.
    # Authentication remains enforced by Angular/Spring Security and should additionally
    # be protected with a Cloudflare Access self-hosted application.
    location = / {
        # Canonicalize the operator hostname without inheriting the internal :8080 origin port.
        # A relative Location is origin-agnostic and preserves the public HTTPS scheme at Cloudflare.
        if ($monitor_root_redirect) { return 302 /monitor$is_args$args; }
        proxy_pass http://web_upstream;
        proxy_read_timeout 20s;
    }


    # Dedicated SRE console. The same private edge serves both hostnames, but the monitor
    # route is only exposed when the Host header is monitor.neelastack.com.
    location = /monitor {
        if ($is_monitor_host = 0) { return 404; }
        proxy_pass http://web_upstream;
        proxy_read_timeout 20s;
    }

    # Keep business admin pages on the Events hostname. The monitor hostname exposes only the SRE console
    # plus the authenticated API paths it needs.
    location ^~ /admin {
        if ($is_monitor_host = 1) { return 404; }
        proxy_pass http://web_upstream;
        proxy_read_timeout 20s;
    }

    # High-volume public discovery reads: short local cache + stale-on-error protects the DB during bursts.
    # NGINX only caches GET/HEAD by default; all other methods continue to the backend unchanged.
    location ^~ /api/v1/public/events/ {
        limit_req zone=public_catalog_api burst=2000 nodelay;
        proxy_pass http://backend_upstream;
        proxy_read_timeout 20s;
        proxy_send_timeout 10s;
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_buffer_size 16k;
        proxy_cache public_catalog;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 5s;
        proxy_cache_valid 404 2s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_bypass $http_authorization $cookie_lk_refresh $cookie_ld_checkout;
        proxy_no_cache $http_authorization $cookie_lk_refresh $cookie_ld_checkout;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Private-only NGINX metrics endpoint for the internal nginx-prometheus-exporter.
    location = /stub_status {
        access_log off;
        stub_status;
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;
    }

    location ^~ /api/v1/auth/ {
        limit_req zone=auth_api burst=10 nodelay;
        proxy_pass http://backend_upstream;
        proxy_send_timeout 15s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    # Buffer admin event responses at the origin edge. This includes streamed CSV exports,
    # preventing the generic unbuffered /api/ proxy from exposing an unstable transfer to the edge.
    # Keep the collection POST exact and proxied without any redirect. This is especially important
    # for authenticated JSON POST requests because a browser/edge redirect can lose the original body.
    location = /api/v1/admin/events {
        limit_req zone=public_api burst=40 nodelay;
        proxy_pass http://backend_upstream;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_buffer_size 16k;
    }

    # The log viewer is intentionally low-rate: each ADMIN browser polls only every 5 seconds.
    # Bound it separately so an operator session cannot accidentally generate a Loki query storm.
    location = /api/v1/admin/ops/logs {
        limit_req zone=ops_logs_api burst=4 nodelay;
        proxy_pass http://backend_upstream;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_buffering on;
        proxy_buffers 4 16k;
        proxy_buffer_size 16k;
    }

    location ^~ /api/v1/admin/events/ {
        limit_req zone=public_api burst=40 nodelay;
        proxy_pass http://backend_upstream;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_buffer_size 16k;
    }

    location ^~ /api/ {
        limit_req zone=public_api burst=40 nodelay;
        proxy_pass http://backend_upstream;
        proxy_send_timeout 15s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    location = /robots.txt  { proxy_pass http://backend_upstream; proxy_read_timeout 10s; }
    location = /sitemap.xml { proxy_pass http://backend_upstream; proxy_read_timeout 10s; }
    location ~ ^/sitemap-[0-9]+\.xml$ { proxy_pass http://backend_upstream; proxy_read_timeout 10s; }

    location ^~ /ticket/ {
        access_log off;   # ticket access tokens may appear in URLs
        proxy_pass http://web_upstream;
        proxy_read_timeout 20s;
    }

    location / {
        proxy_pass http://web_upstream;
        proxy_read_timeout 20s;
    }
}
